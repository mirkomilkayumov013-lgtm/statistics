<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика - Платформа тестирования</title>
    <!-- 
        Statistics Testing Platform - CDI Style
        ============================
        A fully self-contained, single-file interactive educational platform
        for mathematical statistics and probability theory.
        
        Architecture:
        - MathEngine: All statistical calculations
        - DataGenerator: Random data generation for tasks
        - TaskRenderer: UI rendering for each task type
        - AnswerChecker: Validates user answers with tolerance
        - SolutionDisplay: Step-by-step solution generation
        - I18n: Internationalization (RU, UZ, EN)
        - App: Main controller orchestrating everything
        
        No external dependencies. Works completely offline.
    -->
    <style>
/* ============================================================
   CDI Platform Academic Style
   ============================================================ */
:root {
    --header-bg: #2c5f8a;
    --header-text: #ffffff;
    --page-bg: #ffffff;
    --text-primary: #222222;
    --text-secondary: #333333;
    --text-uz: #003366;
    --text-en: #555555;
    --border-color: #cccccc;
    --table-header-bg: #2c5f8a;
    --table-header-text: #ffffff;
    --btn-primary-bg: #2c5f8a;
    --btn-primary-text: #ffffff;
    --btn-success-bg: #2e7d32;
    --btn-warning-bg: #e65100;
    --btn-danger-bg: #c62828;
    --correct-bg: #d4edda;
    --correct-border: #28a745;
    --incorrect-bg: #f8d7da;
    --incorrect-border: #dc3545;
    --solution-bg: #f0f4f8;
    --font-family: 'Segoe UI', Arial, sans-serif;
}

[data-theme="dark"] {
    --header-bg: #1a3a5c;
    --page-bg: #1e1e2e;
    --text-primary: #e0e0e0;
    --text-secondary: #cccccc;
    --text-uz: #5dade2;
    --text-en: #aaaaaa;
    --border-color: #444444;
    --table-header-bg: #1a3a5c;
    --table-header-text: #ffffff;
    --btn-primary-bg: #3a7abf;
    --correct-bg: #1a4a2a;
    --correct-border: #4caf50;
    --incorrect-bg: #4a1a1a;
    --incorrect-border: #f44336;
    --solution-bg: #2a2a3e;
}

*, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font-family);
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-primary);
    background-color: var(--page-bg);
    min-height: 100vh;
}

/* ============================================================
   Top Bar - minimal header
   ============================================================ */
.top-bar {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 8px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
}

.top-bar__title {
    font-size: 15px;
    font-weight: 700;
}

.top-bar__controls {
    display: flex;
    align-items: center;
    gap: 12px;
}

.top-bar__timer,
.top-bar__score {
    font-size: 12px;
    padding: 3px 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
}

.top-bar__btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.3);
    color: #ffffff;
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
}

.top-bar__btn:hover {
    background: rgba(255,255,255,0.25);
}

/* ============================================================
   Task Selector
   ============================================================ */
.task-selector {
    max-width: 900px;
    margin: 16px auto;
    padding: 0 20px;
}

.task-selector select {
    width: 100%;
    padding: 8px 12px;
    font-size: 14px;
    font-family: var(--font-family);
    border: 1px solid var(--border-color);
    background: var(--page-bg);
    color: var(--text-primary);
    cursor: pointer;
}

/* ============================================================
   Main Content Area
   ============================================================ */
.content-area {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 40px;
}

/* ============================================================
   Section Header (Blue bar)
   ============================================================ */
.section-header {
    background: var(--header-bg);
    color: var(--header-text);
    padding: 8px 16px;
    font-size: 14px;
    font-weight: bold;
    margin-top: 16px;
    margin-bottom: 0;
}

/* ============================================================
   Task Body
   ============================================================ */
.task-body {
    padding: 16px 0;
    border-bottom: 1px solid var(--border-color);
}

/* Trilingual description */
.task-desc {
    margin-bottom: 12px;
    line-height: 1.6;
}

.task-desc__ru {
    display: block;
    color: var(--text-primary);
    font-weight: normal;
    margin-bottom: 4px;
}

.task-desc__uz {
    display: block;
    color: var(--text-uz);
    font-weight: normal;
    font-size: 13px;
    margin-bottom: 2px;
}

.task-desc__en {
    display: block;
    color: var(--text-en);
    font-weight: normal;
    font-size: 13px;
}

/* Sample data display */
.sample-data {
    margin: 10px 0;
    font-size: 13px;
}

.sample-data strong {
    font-weight: 600;
}

.sample-values {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 13px;
    word-break: break-all;
}

/* ============================================================
   Numbered Question Items (inline inputs)
   ============================================================ */
.question-list {
    margin: 12px 0;
}

.question-item {
    display: block;
    margin: 8px 0;
    font-size: 14px;
    line-height: 1.8;
}

.question-item__label {
    font-weight: normal;
}

.question-item__label-ru {
    font-weight: 600;
    color: var(--text-primary);
}

.question-item__label-uz {
    color: var(--text-uz);
}

.question-item__label-en {
    color: var(--text-en);
}

.question-item__input {
    width: 70px;
    height: 26px;
    border: 1px solid #999;
    padding: 2px 6px;
    font-size: 13px;
    font-family: var(--font-family);
    text-align: center;
    display: inline-block;
    vertical-align: middle;
    margin-left: 6px;
    background: var(--page-bg);
    color: var(--text-primary);
}

.question-item__input:focus {
    border-color: #2c5f8a;
    outline: none;
}

.question-item__input--correct {
    border-color: var(--correct-border);
    background: var(--correct-bg);
}

.question-item__input--incorrect {
    border-color: var(--incorrect-border);
    background: var(--incorrect-bg);
}

/* ============================================================
   Tables
   ============================================================ */
.data-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 13px;
}

.data-table th {
    background: var(--table-header-bg);
    color: var(--table-header-text);
    padding: 6px 10px;
    text-align: center;
    font-weight: 600;
    font-size: 12px;
    border: 1px solid var(--table-header-bg);
}

.data-table td {
    padding: 5px 10px;
    text-align: center;
    border: 1px solid var(--border-color);
    background: var(--page-bg);
    font-size: 13px;
}

/* ============================================================
   Buttons
   ============================================================ */
.btn-row {
    margin: 16px 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.btn {
    padding: 6px 16px;
    border: 1px solid var(--border-color);
    font-size: 13px;
    font-family: var(--font-family);
    cursor: pointer;
    font-weight: 600;
    color: #ffffff;
    border: none;
}

.btn:hover {
    opacity: 0.85;
}

.btn--check {
    background: var(--btn-primary-bg);
}

.btn--solution {
    background: var(--btn-warning-bg);
}

.btn--answers {
    background: var(--btn-success-bg);
}

.btn--newdata {
    background: var(--btn-danger-bg);
}

/* ============================================================
   Solution Display
   ============================================================ */
.solution-block {
    margin-top: 16px;
    padding: 12px;
    background: var(--solution-bg);
    border: 1px solid var(--border-color);
}

.solution-block__title {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 6px;
}

.solution-step {
    margin-bottom: 10px;
    padding: 8px;
    border-left: 3px solid var(--header-bg);
    background: var(--page-bg);
}

.solution-step__title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 2px;
}

.solution-step__formula {
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    color: var(--text-secondary);
    margin: 2px 0;
}

.solution-step__result {
    font-weight: 600;
    color: var(--header-bg);
    font-size: 13px;
}

/* ============================================================
   Info line (parameters display)
   ============================================================ */
.info-line {
    font-size: 13px;
    margin: 6px 0;
    color: var(--text-secondary);
}

.info-line strong {
    font-weight: 600;
}

/* ============================================================
   Responsive
   ============================================================ */
@media (max-width: 600px) {
    .top-bar {
        flex-direction: column;
        align-items: flex-start;
    }
    .btn-row {
        flex-direction: column;
    }
    .btn {
        width: 100%;
        text-align: center;
    }
}

/* ============================================================
   Hidden utility
   ============================================================ */
.hidden {
    display: none !important;
}

</head>

    <!-- Task Selector -->
    <div class="task-selector">
        <select id="taskSelect" onchange="app.selectTask(this.value)">
        </select>
    </div>

    <!-- Main Content -->
    <div class="content-area" id="taskContent">

                        variance: 'Calculate the corrected (sample) variance of the given sample.',
                        stdDeviation: 'Calculate the standard deviation of the sample.',
                        medianCalc: 'Find the median of the given sample.',
                        modeCalc: 'Find the mode of the given sample.',
                        intervalSeries: 'Build an interval variation series and calculate frequencies for each interval.'
                    }
                }
            };
        }

        tLang(key, lang) {
            const keys = key.split('.');
            let value = this.translations[lang];
            for (const k of keys) {
                if (value && typeof value === 'object') {
                    value = value[k];
                } else {
                    return key;
                }
            }
            return value || key;
        }

        t(key) {
            return this.tLang(key, 'ru');
        }

        /** Return trilingual text as three lines for section headers */
        triHeader(key) {
            const ru = this.tLang(key, 'ru');
            const uz = this.tLang(key, 'uz');
            const en = this.tLang(key, 'en');
            return `${ru} / ${uz} / ${en}`;
        }

        /** Return trilingual description block */
        triDesc(key) {
            const ru = this.tLang(key, 'ru');
            const uz = this.tLang(key, 'uz');
            const en = this.tLang(key, 'en');
            return `<div class="task-desc"><span class="task-desc__ru">${ru}</span><span class="task-desc__uz">${uz}</span><span class="task-desc__en">${en}</span></div>`;
        }

        /** Inline trilingual label for question items (compact " / " format) */
        triLabel(key) {
            const ru = this.tLang(key, 'ru');
            const uz = this.tLang(key, 'uz');
            const en = this.tLang(key, 'en');
            return `<span class="question-item__label-ru">${ru}</span> / <span class="question-item__label-uz">${uz}</span> / <span class="question-item__label-en">${en}</span>`;
        }

        /** For dropdown options */
        triOption(key) {
            const ru = this.tLang(key, 'ru');
            const uz = this.tLang(key, 'uz');
            const en = this.tLang(key, 'en');
            return `${ru} / ${uz} / ${en}`;
        }

        setLanguage(lang) {
            if (this.translations[lang]) {
                this.currentLang = lang;
            }
        }
    }

    /* ============================================================
       MathEngine Class - Statistical Calculations
       ============================================================ */
    class MathEngine {
        sampleMean(data) {
            if (!data || data.length === 0) return 0;
            const sum = data.reduce((a, b) => a + b, 0);
            return this.round(sum / data.length);
        }

        correctedVariance(data) {
            if (!data || data.length < 2) return 0;
            const mean = data.reduce((a, b) => a + b, 0) / data.length;
            const sumSquaredDiff = data.reduce((sum, x) => sum + Math.pow(x - mean, 2), 0);
            return this.round(sumSquaredDiff / (data.length - 1));
        }

        standardDeviation(data) {
            if (!data || data.length < 2) return 0;
            const mean = data.reduce((a, b) => a + b, 0) / data.length;
            const sumSquaredDiff = data.reduce((sum, x) => sum + Math.pow(x - mean, 2), 0);
            const variance = sumSquaredDiff / (data.length - 1);
            return this.round(Math.sqrt(variance));
        }

        median(data) {
            if (!data || data.length === 0) return 0;
            const sorted = [...data].sort((a, b) => a - b);
            const mid = Math.floor(sorted.length / 2);
            if (sorted.length % 2 === 0) {
                return this.round((sorted[mid - 1] + sorted[mid]) / 2);
            }
            return this.round(sorted[mid]);
        }

        mode(data) {
            if (!data || data.length === 0) return [0];
            const freq = {};
            data.forEach(x => { freq[x] = (freq[x] || 0) + 1; });
            const maxFreq = Math.max(...Object.values(freq));
            if (maxFreq === 1) return [];
            const modes = Object.keys(freq)
                .filter(k => freq[k] === maxFreq)
                .map(Number)
                .sort((a, b) => a - b);
            return modes;
        }

        range(data) {
            if (!data || data.length === 0) return 0;
            return this.round(Math.max(...data) - Math.min(...data));
        }

        relativeFrequencies(data) {
            if (!data || data.length === 0) return {};
            const freq = {};
            data.forEach(x => { freq[x] = (freq[x] || 0) + 1; });
            const result = {};
            const sortedKeys = Object.keys(freq).map(Number).sort((a, b) => a - b);
            sortedKeys.forEach(k => {
                result[k] = this.round(freq[k] / data.length);
            });
            return result;
        }

        empiricalDistributionFunction(data) {
            if (!data || data.length === 0) return {};
            const freq = {};
            data.forEach(x => { freq[x] = (freq[x] || 0) + 1; });
            const sortedKeys = Object.keys(freq).map(Number).sort((a, b) => a - b);
            const result = {};
            let cumulative = 0;
            sortedKeys.forEach(k => {
                cumulative += freq[k] / data.length;
                result[k] = this.round(cumulative);
            });
            return result;
        }

        confidenceIntervalMean(data, confidence) {
            if (!data || data.length < 2) return { lower: 0, upper: 0 };
            const n = data.length;
            const mean = data.reduce((a, b) => a + b, 0) / n;
            const s = Math.sqrt(data.reduce((sum, x) => sum + Math.pow(x - mean, 2), 0) / (n - 1));
            const df = n - 1;
            const t = this.tQuantile(confidence, df);
            const margin = t * s / Math.sqrt(n);
            return {
                lower: this.round(mean - margin),
                upper: this.round(mean + margin),
                mean: this.round(mean),
                margin: this.round(margin),
                t: this.round(t),
                s: this.round(s)
            };
        }

        confidenceIntervalProportion(p, n, confidence) {
            if (n <= 0 || p < 0 || p > 1) return { lower: 0, upper: 0 };
            const z = this.normalQuantile(confidence);
            const margin = z * Math.sqrt(p * (1 - p) / n);
            return {
                lower: this.round(Math.max(0, p - margin)),
                upper: this.round(Math.min(1, p + margin)),
                p: this.round(p),
                margin: this.round(margin),
                z: this.round(z)
            };
        }

        zTest(sampleMean, populationMean, sigma, n) {
            if (sigma <= 0 || n <= 0) return { z: 0, reject: false };
            const z = (sampleMean - populationMean) / (sigma / Math.sqrt(n));
            return this.round(z);
        }

        tTest(sampleMean, populationMean, s, n) {
            if (s <= 0 || n <= 0) return 0;
            const t = (sampleMean - populationMean) / (s / Math.sqrt(n));
            return this.round(t);
        }

        normalQuantile(confidence) {
            const p = (1 + confidence) / 2;
            const t = Math.sqrt(-2 * Math.log(1 - p));
            const c0 = 2.515517;
            const c1 = 0.802853;
            const c2 = 0.010328;
            const d1 = 1.432788;
            const d2 = 0.189269;
            const d3 = 0.001308;
            const z = t - (c0 + c1 * t + c2 * t * t) / (1 + d1 * t + d2 * t * t + d3 * t * t * t);
            return this.round(z);
        }

        tQuantile(confidence, df) {
            const tTable = {
                1:  {0.90: 6.314, 0.95: 12.706, 0.99: 63.657},
                2:  {0.90: 2.920, 0.95: 4.303, 0.99: 9.925},
                3:  {0.90: 2.353, 0.95: 3.182, 0.99: 5.841},
                4:  {0.90: 2.132, 0.95: 2.776, 0.99: 4.604},
                5:  {0.90: 2.015, 0.95: 2.571, 0.99: 4.032},
                6:  {0.90: 1.943, 0.95: 2.447, 0.99: 3.707},
                7:  {0.90: 1.895, 0.95: 2.365, 0.99: 3.499},
                8:  {0.90: 1.860, 0.95: 2.306, 0.99: 3.355},
                9:  {0.90: 1.833, 0.95: 2.262, 0.99: 3.250},
                10: {0.90: 1.812, 0.95: 2.228, 0.99: 3.169},
                11: {0.90: 1.796, 0.95: 2.201, 0.99: 3.106},
                12: {0.90: 1.782, 0.95: 2.179, 0.99: 3.055},
                13: {0.90: 1.771, 0.95: 2.160, 0.99: 3.012},
                14: {0.90: 1.761, 0.95: 2.145, 0.99: 2.977},
                15: {0.90: 1.753, 0.95: 2.131, 0.99: 2.947},
                16: {0.90: 1.746, 0.95: 2.120, 0.99: 2.921},
                17: {0.90: 1.740, 0.95: 2.110, 0.99: 2.898},
                18: {0.90: 1.734, 0.95: 2.101, 0.99: 2.878},
                19: {0.90: 1.729, 0.95: 2.093, 0.99: 2.861},
                20: {0.90: 1.725, 0.95: 2.086, 0.99: 2.845},
                21: {0.90: 1.721, 0.95: 2.080, 0.99: 2.831},
                22: {0.90: 1.717, 0.95: 2.074, 0.99: 2.819},
                23: {0.90: 1.714, 0.95: 2.069, 0.99: 2.807},
                24: {0.90: 1.711, 0.95: 2.064, 0.99: 2.797},
                25: {0.90: 1.708, 0.95: 2.060, 0.99: 2.787},
                26: {0.90: 1.706, 0.95: 2.056, 0.99: 2.779},
                27: {0.90: 1.703, 0.95: 2.052, 0.99: 2.771},
                28: {0.90: 1.701, 0.95: 2.048, 0.99: 2.763},
                29: {0.90: 1.699, 0.95: 2.045, 0.99: 2.756},
                30: {0.90: 1.697, 0.95: 2.042, 0.99: 2.750}
            };
            const clampedDf = Math.min(Math.max(Math.round(df), 1), 30);
            const confLevels = [0.90, 0.95, 0.99];
            let closestConf = confLevels[0];
            let minDiff = Math.abs(confidence - confLevels[0]);
            for (const cl of confLevels) {
                const diff = Math.abs(confidence - cl);
                if (diff < minDiff) {
                    minDiff = diff;
                    closestConf = cl;
                }
            }
            if (clampedDf <= 30) {
                return tTable[clampedDf][closestConf];
            }
            return this.normalQuantile(confidence);
        }

        round(value) {
            if (!isFinite(value) || isNaN(value)) return 0;
            return Math.round(value * 1000) / 1000;
        }
    }

    /* ============================================================
       DataGenerator Class - Random Data Generation
       ============================================================ */
    class DataGenerator {
        generateSampleData(n, min, max) {
            const data = [];
            for (let i = 0; i < n; i++) {
                data.push(Math.floor(Math.random() * (max - min + 1)) + min);
            }
            return data;
        }

        generateNormalSample(n, mean, std) {
            const data = [];
            for (let i = 0; i < n; i++) {
                let u1 = Math.random();
                let u2 = Math.random();
                while (u1 === 0) u1 = Math.random();
                const z = Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
                data.push(Math.round((mean + z * std) * 10) / 10);
            }
            return data;
        }

        generateHypothesisTestData() {
            const n = this.randomInt(10, 25);
            const populationMean = this.randomInt(40, 80);
            const sigma = this.randomInt(3, 12);
            const alpha = this.pickRandom([0.01, 0.05, 0.10]);
            const shift = (Math.random() > 0.5) ? this.randomInt(-5, 5) : 0;
            const sample = this.generateNormalSample(n, populationMean + shift, sigma);
            return { sample, populationMean, sigma, alpha };
        }

        generateConfidenceIntervalMeanData() {
            const n = this.randomInt(10, 25);
            const confidence = this.pickRandom([0.90, 0.95, 0.99]);
            const mean = this.randomInt(30, 70);
            const std = this.randomInt(5, 15);
            const sample = this.generateNormalSample(n, mean, std);
            return { sample, confidence };
        }

        generateConfidenceIntervalProportionData() {
            const n = this.randomInt(50, 200);
            const trueP = (this.randomInt(20, 80)) / 100;
            const successes = Math.round(n * trueP);
            const confidence = this.pickRandom([0.90, 0.95, 0.99]);
            return { successes, n, confidence };
        }

        generateEmpiricalDistributionData() {
            const n = this.randomInt(15, 25);
            const min = this.randomInt(1, 5);
            const max = min + this.randomInt(5, 10);
            const sample = this.generateSampleData(n, min, max);
            return { sample };
        }

        generateHistogramData() {
            const n = this.randomInt(20, 30);
            const sample = this.generateSampleData(n, 10, 80);
            const intervalCount = this.randomInt(4, 7);
            return { sample, intervalCount };
        }

        generateSampleCharacteristicsData() {
            const n = this.randomInt(10, 20);
            const sample = this.generateSampleData(n, 5, 50);
            return { sample };
        }

        generateZTestData() {
            const n = this.randomInt(15, 30);
            const populationMean = this.randomInt(40, 80);
            const sigma = this.randomInt(4, 12);
            const alpha = this.pickRandom([0.01, 0.05, 0.10]);
            const shift = (Math.random() > 0.5) ? this.randomInt(-4, 4) : 0;
            const sample = this.generateNormalSample(n, populationMean + shift, sigma);
            return { sample, populationMean, sigma, alpha };
        }

        generateTTestData() {
            const n = this.randomInt(10, 25);
            const populationMean = this.randomInt(30, 70);
            const std = this.randomInt(5, 15);
            const alpha = this.pickRandom([0.01, 0.05, 0.10]);
            const shift = (Math.random() > 0.5) ? this.randomInt(-5, 5) : 0;
            const sample = this.generateNormalSample(n, populationMean + shift, std);
            return { sample, populationMean, alpha };
        }

        generateVarianceData() {
            const n = this.randomInt(8, 18);
            const sample = this.generateSampleData(n, 10, 60);
            return { sample };
        }

        generateStdDevData() {
            const n = this.randomInt(8, 18);
            const sample = this.generateSampleData(n, 10, 60);
            return { sample };
        }

        generateMedianData() {
            const n = this.randomInt(9, 20);
            const sample = this.generateSampleData(n, 5, 50);
            return { sample };
        }

        generateModeData() {
            const n = this.randomInt(12, 20);
            const base = this.generateSampleData(n - 4, 5, 30);
            const modeValue = this.pickRandom(base);
            for (let i = 0; i < 4; i++) {
                base.push(modeValue);
            }
            for (let i = base.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [base[i], base[j]] = [base[j], base[i]];
            }
            return { sample: base };
        }

        generateIntervalSeriesData() {
            const n = this.randomInt(20, 30);
            const sample = this.generateSampleData(n, 10, 90);
            const intervalCount = this.randomInt(4, 6);
            return { sample, intervalCount };
        }

        randomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        pickRandom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }
    }

    /* ============================================================
       TaskRenderer Class - CDI Platform Style Rendering
       ============================================================ */
    class TaskRenderer {
        constructor(i18n, mathEngine) {
            this.i18n = i18n;
            this.math = mathEngine;
        }

        renderTask(taskType, data) {
            switch (taskType) {
                case 'sampleCharacteristics': return this.renderSampleCharacteristics(data);
                case 'empiricalDistribution': return this.renderEmpiricalDistribution(data);
                case 'histogram': return this.renderHistogram(data);
                case 'confidenceMean': return this.renderConfidenceMean(data);
                case 'confidenceProportion': return this.renderConfidenceProportion(data);
                case 'hypothesisTesting': return this.renderHypothesisTesting(data);
                case 'zTest': return this.renderZTest(data);
                case 'tTest': return this.renderTTest(data);
                case 'variance': return this.renderVariance(data);
                case 'stdDeviation': return this.renderStdDeviation(data);
                case 'medianCalc': return this.renderMedianCalc(data);
                case 'modeCalc': return this.renderModeCalc(data);
                case 'intervalSeries': return this.renderIntervalSeries(data);
                default: return '<p>Unknown task type</p>';
            }
        }

        /** Render table in CDI style */
        renderTable(headers, rows) {
            let html = '<table class="data-table"><thead><tr>';
            headers.forEach(h => { html += `<th>${h}</th>`; });
            html += '</tr></thead><tbody>';
            rows.forEach(row => {
                html += '<tr>';
                row.forEach(cell => { html += `<td>${cell}</td>`; });
                html += '</tr>';
            });
            html += '</tbody></table>';
            return html;
        }

        /** Render numbered question items with inline inputs */
        renderQuestions(fields) {
            let html = '<div class="question-list">';
            fields.forEach((field, idx) => {
                html += `<div class="question-item">
                    <span class="question-item__label">${idx + 1}. ${field.label}:</span>
                    <input type="text" class="question-item__input" id="input-${field.id}" data-answer="${field.answer}">
                </div>`;
            });
            html += '</div>';
            return html;
        }

        /** Render action buttons */
        renderButtons() {
            const i18n = this.i18n;
            const btnCheck = `${i18n.tLang('btnCheck','ru')} / ${i18n.tLang('btnCheck','uz')} / ${i18n.tLang('btnCheck','en')}`;
            const btnSolution = `${i18n.tLang('btnSolution','ru')} / ${i18n.tLang('btnSolution','uz')} / ${i18n.tLang('btnSolution','en')}`;
            const btnShowAnswers = `${i18n.tLang('btnShowAnswers','ru')} / ${i18n.tLang('btnShowAnswers','uz')} / ${i18n.tLang('btnShowAnswers','en')}`;
            const btnNewData = `${i18n.tLang('btnNewData','ru')} / ${i18n.tLang('btnNewData','uz')} / ${i18n.tLang('btnNewData','en')}`;
            return `<div class="btn-row">
                <button class="btn btn--check" onclick="app.checkAnswers()">${btnCheck}</button>
                <button class="btn btn--solution" onclick="app.showSolution()">${btnSolution}</button>
                <button class="btn btn--answers" onclick="app.showAnswers()">${btnShowAnswers}</button>
                <button class="btn btn--newdata" onclick="app.generateNewData()">${btnNewData}</button>
            </div>`;
        }

        /** Sample display line */
        renderSampleLine(sample) {
            const i18n = this.i18n;
            return `<div class="sample-data">
                <strong>${i18n.triLabel('sample')}:</strong> <span class="sample-values">${sample.join(', ')}</span><br>
                <strong>${i18n.triLabel('sampleSize')}:</strong> ${sample.length}
            </div>`;
        }

        // ============================================================
        // Individual Task Renderers
        // ============================================================

        renderSampleCharacteristics(data) {
            const i18n = this.i18n;
            const sample = data.sample;
            const mean = this.math.sampleMean(sample);
            const variance = this.math.correctedVariance(sample);
            const stdDev = this.math.standardDeviation(sample);
            const med = this.math.median(sample);
            const modes = this.math.mode(sample);
            const range = this.math.range(sample);
            const min = Math.min(...sample);
            const max = Math.max(...sample);

            const fields = [
                { id: 'mean', label: i18n.triLabel('mean'), answer: mean },
                { id: 'variance', label: i18n.triLabel('variance'), answer: variance },
                { id: 'stdDev', label: i18n.triLabel('stdDev'), answer: stdDev },
                { id: 'median', label: i18n.triLabel('median'), answer: med },
                { id: 'mode', label: i18n.triLabel('mode'), answer: modes.length > 0 ? modes.join(', ') : '-' },
                { id: 'range', label: i18n.triLabel('range'), answer: range },
                { id: 'min', label: i18n.triLabel('min'), answer: min },
                { id: 'max', label: i18n.triLabel('max'), answer: max }
            ];

            return `<div class="section-header">${i18n.triHeader('tasks.sampleCharacteristics')}</div>
                <div class="task-body">
                ${i18n.triDesc('taskDescriptions.sampleCharacteristics')}
                ${this.renderSampleLine(sample)}
                ${this.renderQuestions(fields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;
        }

        renderEmpiricalDistribution(data) {
            const i18n = this.i18n;
            const sample = data.sample;
            const relFreq = this.math.relativeFrequencies(sample);
            const edf = this.math.empiricalDistributionFunction(sample);
            const sortedKeys = Object.keys(relFreq).map(Number).sort((a, b) => a - b);

            const freq = {};
            sample.forEach(x => { freq[x] = (freq[x] || 0) + 1; });

            const fields = sortedKeys.map(k => ({
                id: `relfreq-${k}`,
                label: `${i18n.triLabel('relFreq')} (x=${k})`,
                answer: relFreq[k]
            }));

            const cumFields = sortedKeys.map(k => ({
                id: `cumfreq-${k}`,
                label: `F(${k})`,
                answer: edf[k]
            }));

            const allFields = [...fields, ...cumFields];

            return `<div class="section-header">${i18n.triHeader('tasks.empiricalDistribution')}</div>
                <div class="task-body">
                ${i18n.triDesc('taskDescriptions.empiricalDistribution')}
                ${this.renderSampleLine(sample)}
                ${this.renderQuestions(allFields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;
        }

        renderHistogram(data) {
            const i18n = this.i18n;
            const sample = data.sample;
            const intervalCount = data.intervalCount;
            const min = Math.min(...sample);
            const max = Math.max(...sample);
            const width = this.math.round((max - min) / intervalCount);

            const intervals = [];
            for (let i = 0; i < intervalCount; i++) {
                const lower = this.math.round(min + i * width);
                const upper = (i === intervalCount - 1) ? max : this.math.round(min + (i + 1) * width);
                let count = 0;
                sample.forEach(x => {
                    if (i === intervalCount - 1) {
                        if (x >= lower && x <= upper) count++;
                    } else {
                        if (x >= lower && x < upper) count++;
                    }
                });
                intervals.push({ lower, upper, count, relFreq: this.math.round(count / sample.length) });
            }

            const fields = intervals.map((intv, idx) => ({
                id: `hist-${idx}`,
                label: `[${intv.lower}; ${intv.upper}${idx === intervals.length - 1 ? ']' : ')'}`,
                answer: intv.relFreq
            }));

            return `<div class="section-header">${i18n.triHeader('tasks.histogram')}</div>
                <div class="task-body">
                ${i18n.triDesc('taskDescriptions.histogram')}
                ${this.renderSampleLine(sample)}
                <div class="info-line"><strong>k =</strong> ${intervalCount} | <strong>Min =</strong> ${min} | <strong>Max =</strong> ${max} | <strong>h =</strong> ${width}</div>
                ${this.renderQuestions(fields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;
        }

        renderConfidenceMean(data) {
            const i18n = this.i18n;
            const sample = data.sample;
            const confidence = data.confidence;
            const result = this.math.confidenceIntervalMean(sample, confidence);

            const fields = [
                { id: 'ci-mean', label: i18n.triLabel('mean'), answer: result.mean },
                { id: 'ci-lower', label: i18n.triLabel('lowerBound'), answer: result.lower },
                { id: 'ci-upper', label: i18n.triLabel('upperBound'), answer: result.upper }
            ];

            return `<div class="section-header">${i18n.triHeader('tasks.confidenceMean')}</div>
                <div class="task-body">
                ${i18n.triDesc('taskDescriptions.confidenceMean')}
                ${this.renderSampleLine(sample)}
                <div class="info-line"><strong>${i18n.triLabel('confidence')}:</strong> ${confidence}</div>
                ${this.renderQuestions(fields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;
        }

        renderConfidenceProportion(data) {

        renderHypothesisTesting(data) {

                ${i18n.triDesc('taskDescriptions.hypothesisTesting')}
                ${this.renderSampleLine(sample)}

                ${this.renderQuestions(fields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;

        renderZTest(data) {

            const sample = data.sample;
            const populationMean = data.populationMean;
            const sigma = data.sigma;
            const alpha = data.alpha;
            const sampleMean = this.math.sampleMean(sample);
            const n = sample.length;
            const zStat = this.math.zTest(sampleMean, populationMean, sigma, n);
            const confidence = 1 - alpha;
            const zCritical = this.math.normalQuantile(confidence);

            const fields = [
                { id: 'zt-mean', label: i18n.triLabel('mean'), answer: sampleMean },
                { id: 'zt-z', label: i18n.triLabel('zValue'), answer: zStat },
                { id: 'zt-zcrit', label: i18n.triLabel('criticalValue'), answer: zCritical },
                { id: 'zt-conclusion', label: i18n.triLabel('conclusion'), answer: reject ? i18n.t('rejectH0') : i18n.t('acceptH0') }
            ];

            return `<div class="section-header">${i18n.triHeader('tasks.zTest')}</div>
                <div class="task-body">
                ${i18n.triDesc('taskDescriptions.zTest')}
                ${this.renderSampleLine(sample)}
                <div class="info-line"><strong>H&#8320;: &#956; = ${populationMean}</strong> | <strong>${i18n.triLabel('sigma')}:</strong> ${sigma} | <strong>${i18n.triLabel('alpha')}:</strong> ${alpha}</div>
                ${this.renderQuestions(fields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;

        renderTTest(data) {
            const i18n = this.i18n;
            const sample = data.sample;
            const populationMean = data.populationMean;
            const alpha = data.alpha;
            const sampleMean = this.math.sampleMean(sample);
            const s = this.math.standardDeviation(sample);
            const n = sample.length;
            const tStat = this.math.tTest(sampleMean, populationMean, s, n);
            const confidence = 1 - alpha;
            const df = n - 1;
            const tCritical = this.math.tQuantile(confidence, df);
            const reject = Math.abs(tStat) > tCritical;

            const fields = [
                { id: 'tt-mean', label: i18n.triLabel('mean'), answer: sampleMean },
                { id: 'tt-s', label: i18n.triLabel('stdDev'), answer: s },
                { id: 'tt-t', label: i18n.triLabel('tValue'), answer: tStat },

                { id: 'tt-conclusion', label: i18n.triLabel('conclusion'), answer: reject ? i18n.t('rejectH0') : i18n.t('acceptH0') }
            ];

            return `<div class="section-header">${i18n.triHeader('tasks.tTest')}</div>
                <div class="task-body">

                ${this.renderSampleLine(sample)}
                <div class="info-line"><strong>H&#8320;: &#956; = ${populationMean}</strong> | <strong>${i18n.triLabel('alpha')}:</strong> ${alpha} | <strong>df:</strong> ${df}</div>

                ${this.renderButtons()}

        renderVariance(data) {
            const i18n = this.i18n;

        renderModeCalc(data) {
            const i18n = this.i18n;
            const sample = data.sample;
            const modes = this.math.mode(sample);
            const modeStr = modes.length > 0 ? modes.join(', ') : '-';

            const freq = {};
            sample.forEach(x => { freq[x] = (freq[x] || 0) + 1; });
            const sortedKeys = Object.keys(freq).map(Number).sort((a, b) => a - b);
            const headers = [i18n.triLabel('value'), i18n.triLabel('frequency')];
            const rows = sortedKeys.map(k => [k, freq[k]]);

            const fields = [
                { id: 'mode-mode', label: i18n.triLabel('mode'), answer: modeStr }
            ];

            return `<div class="section-header">${i18n.triHeader('tasks.modeCalc')}</div>
                <div class="task-body">

                ${this.renderQuestions(fields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;
        }

        renderIntervalSeries(data) {
            const i18n = this.i18n;
            const sample = data.sample;
            const intervalCount = data.intervalCount;
            const min = Math.min(...sample);
            const max = Math.max(...sample);
            const width = this.math.round((max - min) / intervalCount);

            const intervals = [];
            for (let i = 0; i < intervalCount; i++) {
                const lower = this.math.round(min + i * width);
                const upper = (i === intervalCount - 1) ? max : this.math.round(min + (i + 1) * width);
                let count = 0;
                sample.forEach(x => {
                    if (i === intervalCount - 1) {
                        if (x >= lower && x <= upper) count++;
                    } else {
                        if (x >= lower && x < upper) count++;
                    }
                });
                intervals.push({ lower, upper, count });
            }

            const fields = intervals.map((intv, idx) => ({
                id: `int-${idx}`,
                label: `[${intv.lower}; ${intv.upper}${idx === intervals.length - 1 ? ']' : ')'}`,
                answer: intv.count
            }));

            return `<div class="section-header">${i18n.triHeader('tasks.intervalSeries')}</div>
                <div class="task-body">
                ${i18n.triDesc('taskDescriptions.intervalSeries')}
                ${this.renderSampleLine(sample)}
                <div class="info-line"><strong>k =</strong> ${intervalCount} | <strong>Min =</strong> ${min} | <strong>Max =</strong> ${max} | <strong>h =</strong> ${width}</div>
                ${this.renderQuestions(fields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;
        }
    }

    /* ============================================================
       AnswerChecker Class - Validates User Answers
       ============================================================ */
    class AnswerChecker {
        constructor(mathEngine) {
            this.math = mathEngine;
        }

        checkAnswer(userAnswer, correctAnswer, tolerance = 0.01) {
            const userStr = String(userAnswer).trim().replace(',', '.');
            const correctStr = String(correctAnswer).trim();
            const userNum = parseFloat(userStr);
            const correctNum = parseFloat(correctStr);
            if (!isNaN(userNum) && !isNaN(correctNum)) {
                return Math.abs(userNum - correctNum) <= tolerance;
            }
            return userStr.toLowerCase() === correctStr.toLowerCase();
        }

        checkAllAnswers() {
            const inputs = document.querySelectorAll('.question-item__input');
            const results = [];
            inputs.forEach(input => {
                const userAnswer = input.value;
                const correctAnswer = input.getAttribute('data-answer');
                const isCorrect = this.checkAnswer(userAnswer, correctAnswer);
                results.push({
                    id: input.id,
                    correct: isCorrect,
                    userAnswer: userAnswer,
                    expectedAnswer: correctAnswer
                });
            });
            return results;
        }

        highlightResults(results) {
            results.forEach(r => {
                const input = document.getElementById(r.id);
                if (input) {
                    input.classList.remove('question-item__input--correct', 'question-item__input--incorrect');
                    if (r.userAnswer.trim() === '') return;
                    if (r.correct) {
                        input.classList.add('question-item__input--correct');
                    } else {
                        input.classList.add('question-item__input--incorrect');
                    }
                }
            });
        }

        calculateScore(results) {
            const answered = results.filter(r => r.userAnswer.trim() !== '');
            if (answered.length === 0) return 0;
            const correct = answered.filter(r => r.correct).length;
            return { correct, total: answered.length, percentage: Math.round(correct / answered.length * 100) };
        }
    }

    /* ============================================================
       SolutionDisplay Class - Step-by-Step Solutions
       ============================================================ */
    class SolutionDisplay {
        constructor(i18n, mathEngine) {
            this.i18n = i18n;
            this.math = mathEngine;
        }

        generateSolution(taskType, data) {
            switch (taskType) {
                case 'sampleCharacteristics': return this.solveSampleCharacteristics(data);
                case 'empiricalDistribution': return this.solveEmpiricalDistribution(data);
                case 'histogram': return this.solveHistogram(data);
                case 'confidenceMean': return this.solveConfidenceMean(data);
                case 'confidenceProportion': return this.solveConfidenceProportion(data);
                case 'hypothesisTesting': return this.solveHypothesisTesting(data);
                case 'zTest': return this.solveZTest(data);
                case 'tTest': return this.solveTTest(data);
                case 'variance': return this.solveVariance(data);
                case 'stdDeviation': return this.solveStdDeviation(data);
                case 'medianCalc': return this.solveMedian(data);
                case 'modeCalc': return this.solveMode(data);
                case 'intervalSeries': return this.solveIntervalSeries(data);
                default: return [];
            }
        }

        renderSolution(steps) {
            const i18n = this.i18n;
            const titleRu = i18n.tLang('solutionTitle', 'ru');
            const titleUz = i18n.tLang('solutionTitle', 'uz');
            const titleEn = i18n.tLang('solutionTitle', 'en');
            let html = `<div class="solution-block">
                <div class="solution-block__title">${titleRu} / ${titleUz} / ${titleEn}</div>`;
            const stepRu = i18n.tLang('step', 'ru');
            const stepUz = i18n.tLang('step', 'uz');
            const stepEn = i18n.tLang('step', 'en');
            const resultRu = i18n.tLang('result', 'ru');
            const resultUz = i18n.tLang('result', 'uz');
            const resultEn = i18n.tLang('result', 'en');
            steps.forEach((step, idx) => {
                html += `<div class="solution-step">
                    <div class="solution-step__title">${stepRu} / ${stepUz} / ${stepEn} ${idx + 1}: ${step.description}</div>
                    ${step.formula ? `<div class="solution-step__formula">${step.formula}</div>` : ''}
                    ${step.substitution ? `<div class="solution-step__formula">${step.substitution}</div>` : ''}
                    <div class="solution-step__result">${resultRu} / ${resultUz} / ${resultEn}: ${step.result}</div>
                </div>`;
            });
            html += '</div>';
            return html;
        }

        solveSampleCharacteristics(data) {
            const sample = data.sample;
            const n = sample.length;
            const sum = sample.reduce((a, b) => a + b, 0);
            const mean = this.math.sampleMean(sample);
            const variance = this.math.correctedVariance(sample);
            const stdDev = this.math.standardDeviation(sample);
            const med = this.math.median(sample);
            const modes = this.math.mode(sample);
            const range = this.math.range(sample);

            return [
                { description: this.i18n.t('mean'), formula: 'x\u0304 = (1/n) * \u03A3x\u1d62', substitution: `x\u0304 = (${sum}) / ${n}`, result: mean },
                { description: this.i18n.t('variance'), formula: 'S\u00B2 = \u03A3(x\u1d62 - x\u0304)\u00B2 / (n-1)', substitution: `S\u00B2 = \u03A3(x\u1d62 - ${mean})\u00B2 / (${n}-1)`, result: variance },
                { description: this.i18n.t('stdDev'), formula: 'S = \u221A(S\u00B2)', substitution: `S = \u221A(${variance})`, result: stdDev },
                { description: this.i18n.t('median'), formula: 'Me = x[(n+1)/2] for odd n, or (x[n/2] + x[n/2+1])/2 for even n', substitution: `n = ${n} (${n % 2 === 0 ? 'even' : 'odd'})`, result: med },
                { description: this.i18n.t('mode'), formula: 'Mo = value(s) with highest frequency', substitution: '', result: modes.length > 0 ? modes.join(', ') : '-' },
                { description: this.i18n.t('range'), formula: 'R = x_max - x_min', substitution: `R = ${Math.max(...sample)} - ${Math.min(...sample)}`, result: range }
            ];
        }

        solveEmpiricalDistribution(data) {
            const sample = data.sample;
            const n = sample.length;
            const freq = {};
            sample.forEach(x => { freq[x] = (freq[x] || 0) + 1; });
            const sortedKeys = Object.keys(freq).map(Number).sort((a, b) => a - b);
            const relFreq = this.math.relativeFrequencies(sample);
            const edf = this.math.empiricalDistributionFunction(sample);

            return [
                { description: this.i18n.t('frequency'), formula: 'n\u1d62 = count of x\u1d62 in sample', substitution: sortedKeys.map(k => `n(${k}) = ${freq[k]}`).join(', '), result: `n = ${n}` },
                { description: this.i18n.t('relFreq'), formula: 'w\u1d62 = n\u1d62 / n', substitution: sortedKeys.map(k => `w(${k}) = ${freq[k]}/${n}`).join(', '), result: sortedKeys.map(k => `w(${k}) = ${relFreq[k]}`).join(', ') },
                { description: this.i18n.t('cumFreq'), formula: 'F(x) = \u03A3 w\u1d62 for x\u1d62 \u2264 x', substitution: '', result: sortedKeys.map(k => `F(${k}) = ${edf[k]}`).join(', ') }
            ];
        }

        solveHistogram(data) {
            const sample = data.sample;
            const n = sample.length;
            const intervalCount = data.intervalCount;
            const min = Math.min(...sample);
            const max = Math.max(...sample);
            const width = this.math.round((max - min) / intervalCount);

            const steps = [{ description: this.i18n.t('solveIntervalWidth'), formula: 'h = (x_max - x_min) / k', substitution: `h = (${max} - ${min}) / ${intervalCount}`, result: width }];

            for (let i = 0; i < intervalCount; i++) {
                const lower = this.math.round(min + i * width);
                const upper = (i === intervalCount - 1) ? max : this.math.round(min + (i + 1) * width);
                let count = 0;
                sample.forEach(x => {
                    if (i === intervalCount - 1) { if (x >= lower && x <= upper) count++; }
                    else { if (x >= lower && x < upper) count++; }
                });
                const relFreq = this.math.round(count / n);
                steps.push({ description: `[${lower}; ${upper}${i === intervalCount - 1 ? ']' : ')'}`, formula: `w = n\u1d62 / n`, substitution: `w = ${count} / ${n}`, result: relFreq });
            }
            return steps;
        }

        solveConfidenceMean(data) {
            const sample = data.sample;
            const n = sample.length;
            const confidence = data.confidence;
            const result = this.math.confidenceIntervalMean(sample, confidence);

            return [
                { description: this.i18n.t('mean'), formula: 'x\u0304 = \u03A3x\u1d62 / n', substitution: `x\u0304 = ${sample.reduce((a, b) => a + b, 0)} / ${n}`, result: result.mean },
                { description: this.i18n.t('stdDev'), formula: 'S = \u221A(\u03A3(x\u1d62 - x\u0304)\u00B2 / (n-1))', substitution: `n = ${n}, df = ${n - 1}`, result: result.s },
                { description: 't-quantile', formula: `t(\u03B1/2, df) for confidence = ${confidence}`, substitution: `t(${this.math.round((1 - confidence) / 2)}, ${n - 1})`, result: result.t },
                { description: 'Margin of error', formula: '\u0394 = t * S / \u221An', substitution: `\u0394 = ${result.t} * ${result.s} / \u221A${n}`, result: result.margin },
                { description: this.i18n.t('answer'), formula: `(x\u0304 - \u0394; x\u0304 + \u0394)`, substitution: `(${result.mean} - ${result.margin}; ${result.mean} + ${result.margin})`, result: `(${result.lower}; ${result.upper})` }
            ];
        }

        solveConfidenceProportion(data) {
            const p = this.math.round(data.successes / data.n);
            const confidence = data.confidence;
            const result = this.math.confidenceIntervalProportion(p, data.n, confidence);

            return [
                { description: this.i18n.t('proportion'), formula: 'p\u0302 = m / n', substitution: `p\u0302 = ${data.successes} / ${data.n}`, result: result.p },
                { description: 'Z-quantile', formula: `z(\u03B1/2) for confidence = ${confidence}`, substitution: '', result: result.z },
                { description: 'Margin of error', formula: '\u0394 = z * \u221A(p\u0302(1-p\u0302)/n)', substitution: `\u0394 = ${result.z} * \u221A(${result.p}*${this.math.round(1 - result.p)}/${data.n})`, result: result.margin },
                { description: this.i18n.t('answer'), formula: '(p\u0302 - \u0394; p\u0302 + \u0394)', substitution: `(${result.p} - ${result.margin}; ${result.p} + ${result.margin})`, result: `(${result.lower}; ${result.upper})` }
            ];
        }

        solveHypothesisTesting(data) {
            const sample = data.sample;
            const n = sample.length;
            const populationMean = data.populationMean;
            const sigma = data.sigma;
            const alpha = data.alpha;
            const sampleMean = this.math.sampleMean(sample);
            const zStat = this.math.zTest(sampleMean, populationMean, sigma, n);
            const confidence = 1 - alpha;
            const zCritical = this.math.normalQuantile(confidence);
            const reject = Math.abs(zStat) > zCritical;

            return [
                { description: this.i18n.t('mean'), formula: 'x\u0304 = \u03A3x\u1d62 / n', substitution: `n = ${n}`, result: sampleMean },
                { description: this.i18n.t('zValue'), formula: 'z = (x\u0304 - \u03BC\u2080) / (\u03C3 / \u221An)', substitution: `z = (${sampleMean} - ${populationMean}) / (${sigma} / \u221A${n})`, result: zStat },
                { description: this.i18n.t('criticalValue'), formula: `z_crit for \u03B1 = ${alpha} (two-tailed)`, substitution: `P(|Z| > z_crit) = ${alpha}`, result: zCritical },
                { description: this.i18n.t('conclusion'), formula: `|z| ${Math.abs(zStat) > zCritical ? '>' : '\u2264'} z_crit`, substitution: `|${zStat}| = ${this.math.round(Math.abs(zStat))} vs ${zCritical}`, result: reject ? this.i18n.t('rejectH0') : this.i18n.t('acceptH0') }
            ];
        }

        solveZTest(data) {
            return this.solveHypothesisTesting(data);
        }

        solveTTest(data) {
            const sample = data.sample;
            const n = sample.length;
            const populationMean = data.populationMean;
            const alpha = data.alpha;
            const sampleMean = this.math.sampleMean(sample);
            const s = this.math.standardDeviation(sample);
            const df = n - 1;
            const tStat = this.math.tTest(sampleMean, populationMean, s, n);
            const confidence = 1 - alpha;
            const tCritical = this.math.tQuantile(confidence, df);
            const reject = Math.abs(tStat) > tCritical;

            return [
                { description: this.i18n.t('mean'), formula: 'x\u0304 = \u03A3x\u1d62 / n', substitution: `n = ${n}`, result: sampleMean },
                { description: this.i18n.t('stdDev'), formula: 'S = \u221A(\u03A3(x\u1d62 - x\u0304)\u00B2 / (n-1))', substitution: `df = ${df}`, result: s },
                { description: this.i18n.t('tValue'), formula: 't = (x\u0304 - \u03BC\u2080) / (S / \u221An)', substitution: `t = (${sampleMean} - ${populationMean}) / (${s} / \u221A${n})`, result: tStat },
                { description: this.i18n.t('criticalValue'), formula: `t_crit(${alpha}, ${df}) (two-tailed)`, substitution: `\u03B1 = ${alpha}, df = ${df}`, result: tCritical },
                { description: this.i18n.t('conclusion'), formula: `|t| ${Math.abs(tStat) > tCritical ? '>' : '\u2264'} t_crit`, substitution: `|${tStat}| = ${this.math.round(Math.abs(tStat))} vs ${tCritical}`, result: reject ? this.i18n.t('rejectH0') : this.i18n.t('acceptH0') }
            ];
        }

        solveVariance(data) {
            const sample = data.sample;
            const n = sample.length;
            const mean = this.math.sampleMean(sample);
            const variance = this.math.correctedVariance(sample);
            const sumSqDiff = this.math.round(sample.reduce((sum, x) => sum + Math.pow(x - mean, 2), 0));

            return [
                { description: this.i18n.t('mean'), formula: 'x\u0304 = \u03A3x\u1d62 / n', substitution: `x\u0304 = ${sample.reduce((a, b) => a + b, 0)} / ${n}`, result: mean },
                { description: '\u03A3(x\u1d62 - x\u0304)\u00B2', formula: 'Sum of squared deviations', substitution: `\u03A3(x\u1d62 - ${mean})\u00B2`, result: sumSqDiff },
                { description: this.i18n.t('variance'), formula: 'S\u00B2 = \u03A3(x\u1d62 - x\u0304)\u00B2 / (n-1)', substitution: `S\u00B2 = ${sumSqDiff} / (${n} - 1) = ${sumSqDiff} / ${n - 1}`, result: variance }
            ];
        }

        solveStdDeviation(data) {
            const steps = this.solveVariance(data);
            const stdDev = this.math.standardDeviation(data.sample);
            const variance = this.math.correctedVariance(data.sample);
            steps.push({ description: this.i18n.t('stdDev'), formula: 'S = \u221A(S\u00B2)', substitution: `S = \u221A(${variance})`, result: stdDev });
            return steps;
        }

        solveMedian(data) {
            const sample = data.sample;
            const sorted = [...sample].sort((a, b) => a - b);
            const n = sorted.length;
            const med = this.math.median(sample);

            const steps = [{ description: this.i18n.t('solveSortSample'), formula: this.i18n.t('solveArrangeAscending'), substitution: sorted.join(', '), result: `n = ${n}` }];

            if (n % 2 === 0) {
                const mid1 = sorted[n / 2 - 1];
                const mid2 = sorted[n / 2];
                steps.push({ description: this.i18n.t('median'), formula: 'Me = (x[n/2] + x[n/2+1]) / 2', substitution: `Me = (${mid1} + ${mid2}) / 2`, result: med });
            } else {
                const midIdx = Math.floor(n / 2);
                steps.push({ description: this.i18n.t('median'), formula: 'Me = x[(n+1)/2]', substitution: `Me = x[${midIdx + 1}] = ${sorted[midIdx]}`, result: med });
            }
            return steps;
        }

        solveMode(data) {
            const sample = data.sample;
            const freq = {};
            sample.forEach(x => { freq[x] = (freq[x] || 0) + 1; });
            const maxFreq = Math.max(...Object.values(freq));
            const modes = this.math.mode(sample);

            return [
                { description: this.i18n.t('frequency'), formula: 'Count occurrences of each value', substitution: Object.keys(freq).map(Number).sort((a, b) => a - b).map(k => `${k}: ${freq[k]}`).join(', '), result: `Max frequency = ${maxFreq}` },
                { description: this.i18n.t('mode'), formula: 'Mo = value(s) with maximum frequency', substitution: '', result: modes.length > 0 ? modes.join(', ') : '-' }
            ];
        }

        solveIntervalSeries(data) {
            const sample = data.sample;
            const n = sample.length;
            const intervalCount = data.intervalCount;
            const min = Math.min(...sample);
            const max = Math.max(...sample);
            const width = this.math.round((max - min) / intervalCount);

            const steps = [{ description: this.i18n.t('solveIntervalWidth'), formula: 'h = (x_max - x_min) / k', substitution: `h = (${max} - ${min}) / ${intervalCount}`, result: width }];

            for (let i = 0; i < intervalCount; i++) {
                const lower = this.math.round(min + i * width);
                const upper = (i === intervalCount - 1) ? max : this.math.round(min + (i + 1) * width);
                let count = 0;
                sample.forEach(x => {
                    if (i === intervalCount - 1) { if (x >= lower && x <= upper) count++; }
                    else { if (x >= lower && x < upper) count++; }
                });
                steps.push({ description: `[${lower}; ${upper}${i === intervalCount - 1 ? ']' : ')'}`, formula: this.i18n.t('solveCountValues'), substitution: `${this.i18n.t('solveValuesIn')} [${lower}; ${upper}${i === intervalCount - 1 ? ']' : ')'}`, result: `n\u1d62 = ${count}` });
            }
            return steps;
        }
    }

    /* ============================================================
       App Class - Main Application Controller
       ============================================================ */
    class App {
        constructor() {
            this.i18n = new I18n();
            this.math = new MathEngine();
            this.dataGen = new DataGenerator();
            this.renderer = new TaskRenderer(this.i18n, this.math);
            this.checker = new AnswerChecker(this.math);
            this.solutionDisplay = new SolutionDisplay(this.i18n, this.math);

            this.taskTypes = [
                'sampleCharacteristics',
                'empiricalDistribution',
                'histogram',
                'confidenceMean',
                'confidenceProportion',
                'hypothesisTesting',
                'zTest',
                'tTest',
                'variance',
                'stdDeviation',
                'medianCalc',
                'modeCalc',
                'intervalSeries'
            ];

            this.state = {
                currentTask: 'sampleCharacteristics',
                currentData: null,
                score: { correct: 0, total: 0 },
                completedTasks: [],
                timerSeconds: 0,
                timerInterval: null,
                darkMode: false,
                language: 'ru',
                alreadyChecked: false
            };
        }

        init() {
            this.loadProgress();
            this.renderTaskSelector();
            this.selectTask(this.state.currentTask);
            this.startTimer();
            this.updateScore();
            this.applyTheme();
        }

        /** Render the task dropdown selector */
        renderTaskSelector() {
            const select = document.getElementById('taskSelect');
            const i18n = this.i18n;
            select.innerHTML = '';
            this.taskTypes.forEach(taskType => {
                const option = document.createElement('option');
                option.value = taskType;
                option.textContent = i18n.triOption('tasks.' + taskType);
                if (taskType === this.state.currentTask) {
                    option.selected = true;
                }
                select.appendChild(option);
            });
        }

        selectTask(taskType) {
            this.state.currentTask = taskType;
            // Update dropdown
            const select = document.getElementById('taskSelect');
            if (select) select.value = taskType;
            this.generateNewData();
            this.saveProgress();
        }

        generateNewData() {
            this.state.alreadyChecked = false;
            const taskType = this.state.currentTask;
            let data;

            switch (taskType) {
                case 'sampleCharacteristics': data = this.dataGen.generateSampleCharacteristicsData(); break;
                case 'empiricalDistribution': data = this.dataGen.generateEmpiricalDistributionData(); break;
                case 'histogram': data = this.dataGen.generateHistogramData(); break;
                case 'confidenceMean': data = this.dataGen.generateConfidenceIntervalMeanData(); break;
                case 'confidenceProportion': data = this.dataGen.generateConfidenceIntervalProportionData(); break;
                case 'hypothesisTesting': data = this.dataGen.generateHypothesisTestData(); break;
                case 'zTest': data = this.dataGen.generateZTestData(); break;
                case 'tTest': data = this.dataGen.generateTTestData(); break;
                case 'variance': data = this.dataGen.generateVarianceData(); break;
                case 'stdDeviation': data = this.dataGen.generateStdDevData(); break;
                case 'medianCalc': data = this.dataGen.generateMedianData(); break;
                case 'modeCalc': data = this.dataGen.generateModeData(); break;
                case 'intervalSeries': data = this.dataGen.generateIntervalSeriesData(); break;
                default: data = this.dataGen.generateSampleCharacteristicsData();
            }

            this.state.currentData = data;
            this.renderCurrentTask();
        }

        renderCurrentTask() {
            const content = document.getElementById('taskContent');
            content.innerHTML = this.renderer.renderTask(this.state.currentTask, this.state.currentData);
        }

        checkAnswers() {
            if (this.state.alreadyChecked) {
                const results = this.checker.checkAllAnswers();
                this.checker.highlightResults(results);
                return;
            }

            const results = this.checker.checkAllAnswers();
            this.checker.highlightResults(results);

            const scoreResult = this.checker.calculateScore(results);
            if (scoreResult.total > 0) {
                this.state.score.correct += scoreResult.correct;
                this.state.score.total += scoreResult.total;
                this.updateScore();

                if (scoreResult.percentage === 100 && !this.state.completedTasks.includes(this.state.currentTask)) {
                    this.state.completedTasks.push(this.state.currentTask);
                }
            }
            this.state.alreadyChecked = true;
            this.saveProgress();
        }

        showSolution() {
            const solutionArea = document.getElementById('solution-area');
            if (solutionArea) {
                const steps = this.solutionDisplay.generateSolution(this.state.currentTask, this.state.currentData);
                solutionArea.innerHTML = this.solutionDisplay.renderSolution(steps);
            }
        }

        showAnswers() {
            const inputs = document.querySelectorAll('.question-item__input');
            inputs.forEach(input => {
                const answer = input.getAttribute('data-answer');
                input.value = answer;
                input.classList.remove('question-item__input--incorrect');
                input.classList.add('question-item__input--correct');
            });
        }

        toggleDarkMode() {
            this.state.darkMode = !this.state.darkMode;
            this.applyTheme();
            this.saveProgress();
        }

        applyTheme() {
            if (this.state.darkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('darkToggle').textContent = '\u2600\uFE0F';
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('darkToggle').textContent = '\uD83C\uDF19';
            }
        }

        startTimer() {
            if (this.state.timerInterval) clearInterval(this.state.timerInterval);
            this.state.timerInterval = setInterval(() => {
                this.state.timerSeconds++;
                this.updateTimerDisplay();
            }, 1000);
            this.updateTimerDisplay();
        }

        updateTimerDisplay() {
            const minutes = Math.floor(this.state.timerSeconds / 60);
            const seconds = this.state.timerSeconds % 60;
            const display = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('timer').textContent = display;
        }

        updateScore() {
            document.getElementById('score').textContent = `${this.state.score.correct}/${this.state.score.total}`;
        }

        saveProgress() {
            const saveData = {
                currentTask: this.state.currentTask,
                score: this.state.score,
                completedTasks: this.state.completedTasks,
                timerSeconds: this.state.timerSeconds,
                darkMode: this.state.darkMode,
                language: this.state.language
            };
            try {
                localStorage.setItem('statistics_platform_state', JSON.stringify(saveData));
            } catch (e) {}
        }

        loadProgress() {
            try {
                const saved = localStorage.getItem('statistics_platform_state');
                if (saved) {
                    const data = JSON.parse(saved);
                    this.state.currentTask = data.currentTask || 'sampleCharacteristics';
                    this.state.score = data.score || { correct: 0, total: 0 };
                    this.state.completedTasks = data.completedTasks || [];
                    this.state.timerSeconds = data.timerSeconds || 0;
                    this.state.darkMode = data.darkMode || false;
                    this.state.language = data.language || 'ru';
                    this.i18n.setLanguage(this.state.language);
                }
            } catch (e) {}
        }

        resetProgress() {
            try {
                localStorage.removeItem('statistics_platform_state');
            } catch (e) {}
            this.state.score = { correct: 0, total: 0 };
            this.state.completedTasks = [];
            this.state.timerSeconds = 0;
            if (this.state.timerInterval) clearInterval(this.state.timerInterval);
            this.state.currentTask = 'sampleCharacteristics';
            this.updateScore();
            this.startTimer();
            this.selectTask('sampleCharacteristics');
        }
    }

    /* ============================================================
       Application Initialization
       ============================================================ */
    let app;
    document.addEventListener('DOMContentLoaded', function() {
        app = new App();
        app.init();
    });
    </script>
</body>
</html>
