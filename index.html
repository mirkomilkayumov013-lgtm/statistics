            const fields = intervals.map((intv, idx) => ({
                id: `int-${idx}`,
                label: `[${intv.lower}; ${intv.upper}${idx === intervals.length - 1 ? ']' : ')'}`,
                answer: intv.count
            }));

            return `<div class="task-card">
                <h2 class="task-card__title">${i18n.t('tasks.intervalSeries')}</h2>
                <p class="task-card__description">${i18n.t('taskDescriptions.intervalSeries')}</p>
                ${this.renderSampleDisplay(sample)}
                <p style="color: var(--text-secondary); margin-bottom: 12px;">
                    <strong>${i18n.t('interval')}:</strong> ${intervalCount} | 
                    <strong>Min:</strong> ${min} | <strong>Max:</strong> ${max} |
                    <strong>h:</strong> ${width}
                </p>
                <h3 style="margin: 16px 0 8px; color: var(--text-secondary);">${i18n.t('intervalFreq')}</h3>
                ${this.renderInputFields(fields)}
                ${this.renderButtons()}
                <div id="solution-area"></div>
            </div>`;
        }
    }

    /* ============================================================
       AnswerChecker Class - Validates User Answers
       ============================================================
       Compares user input with correct answers using configurable
       tolerance. Handles numeric and text answers.
    */
    class AnswerChecker {
        constructor(mathEngine) {
            this.math = mathEngine;
        }

        /**
         * Check a single answer with tolerance
         * For numeric answers: |userAnswer - correctAnswer| <= tolerance
         * For text answers: case-insensitive comparison
         */
        checkAnswer(userAnswer, correctAnswer, tolerance = 0.01) {
            // Clean user input
            const userStr = String(userAnswer).trim().replace(',', '.');
            const correctStr = String(correctAnswer).trim();

            // Try numeric comparison first
            const userNum = parseFloat(userStr);
            const correctNum = parseFloat(correctStr);

            if (!isNaN(userNum) && !isNaN(correctNum)) {
                return Math.abs(userNum - correctNum) <= tolerance;
            }

            // Text comparison (for mode with multiple values, conclusions, etc.)
            return userStr.toLowerCase() === correctStr.toLowerCase();
        }

        /**
         * Check all answer fields in the current task
         * Returns array of {id, correct, userAnswer, expectedAnswer}
         */
        checkAllAnswers() {
            const inputs = document.querySelectorAll('.input-field__input');
            const results = [];
            inputs.forEach(input => {
                const userAnswer = input.value;
                const correctAnswer = input.getAttribute('data-answer');
                const isCorrect = this.checkAnswer(userAnswer, correctAnswer);
                results.push({
                    id: input.id,
                    correct: isCorrect,
                    userAnswer: userAnswer,
                    expectedAnswer: correctAnswer
                });
            });
            return results;
        }

        /**
         * Apply green/red highlighting to inputs based on results
         */
        highlightResults(results) {
            results.forEach(r => {
                const input = document.getElementById(r.id);
                if (input) {
                    input.classList.remove('input-field__input--correct', 'input-field__input--incorrect');
                    if (r.userAnswer.trim() === '') return; // Skip empty
                    if (r.correct) {
                        input.classList.add('input-field__input--correct');
                    } else {
                        input.classList.add('input-field__input--incorrect');
                    }
                }
            });
        }

        /**
         * Calculate score percentage from results
         */
        calculateScore(results) {
            const answered = results.filter(r => r.userAnswer.trim() !== '');
            if (answered.length === 0) return 0;
            const correct = answered.filter(r => r.correct).length;
            return { correct, total: answered.length, percentage: Math.round(correct / answered.length * 100) };
        }
    }

    /* ============================================================
       SolutionDisplay Class - Step-by-Step Solutions
       ============================================================
       Generates detailed mathematical solutions showing:
       - Formula description
       - The formula itself
       - Number substitution
       - Intermediate calculations
       - Final result
    */
    class SolutionDisplay {
        constructor(i18n, mathEngine) {
            this.i18n = i18n;
            this.math = mathEngine;
        }

        /**
         * Generate solution steps for a given task type and data
         * Returns array of step objects
         */
        generateSolution(taskType, data) {
            switch (taskType) {
                case 'sampleCharacteristics': return this.solveSampleCharacteristics(data);
                case 'empiricalDistribution': return this.solveEmpiricalDistribution(data);
                case 'histogram': return this.solveHistogram(data);
                case 'confidenceMean': return this.solveConfidenceMean(data);
                case 'confidenceProportion': return this.solveConfidenceProportion(data);
                case 'hypothesisTesting': return this.solveHypothesisTesting(data);
                case 'zTest': return this.solveZTest(data);
                case 'tTest': return this.solveTTest(data);
                case 'variance': return this.solveVariance(data);
                case 'stdDeviation': return this.solveStdDeviation(data);
                case 'medianCalc': return this.solveMedian(data);
                case 'modeCalc': return this.solveMode(data);
                case 'intervalSeries': return this.solveIntervalSeries(data);
                default: return [];
            }
        }

        /**
         * Render solution steps as HTML
         */
        renderSolution(steps) {
            const i18n = this.i18n;
            let html = `<div class="solution">
                <h3 class="solution__title">${i18n.t('solutionTitle')}</h3>`;
            steps.forEach((step, idx) => {
                html += `<div class="solution__step">
                    <div class="solution__step-title">${i18n.t('step')} ${idx + 1}: ${step.description}</div>
                    ${step.formula ? `<div class="solution__step-formula">${step.formula}</div>` : ''}
                    ${step.substitution ? `<div class="solution__step-formula">${step.substitution}</div>` : ''}
                    <div class="solution__step-result">${i18n.t('result')}: ${step.result}</div>
                </div>`;
            });
            html += '</div>';
            return html;
        }

        // ============================================================
        // Solution Generators for Each Task Type
        // ============================================================

        solveSampleCharacteristics(data) {
            const sample = data.sample;
            const n = sample.length;
            const sum = sample.reduce((a, b) => a + b, 0);
            const mean = this.math.sampleMean(sample);
            const variance = this.math.correctedVariance(sample);
            const stdDev = this.math.standardDeviation(sample);
            const med = this.math.median(sample);
            const modes = this.math.mode(sample);
            const range = this.math.range(sample);

            return [
                {
                    description: this.i18n.t('mean'),
                    formula: 'x\u0304 = (1/n) * \u03A3x\u1d62',
                    substitution: `x\u0304 = (${sum}) / ${n}`,
                    result: mean
                },
                {
                    description: this.i18n.t('variance'),
                    formula: 'S\u00B2 = \u03A3(x\u1d62 - x\u0304)\u00B2 / (n-1)',
                    substitution: `S\u00B2 = \u03A3(x\u1d62 - ${mean})\u00B2 / (${n}-1)`,
                    result: variance
                },
                {
                    description: this.i18n.t('stdDev'),
                    formula: 'S = \u221A(S\u00B2)',
                    substitution: `S = \u221A(${variance})`,
                    result: stdDev
                },
                {
                    description: this.i18n.t('median'),
                    formula: 'Me = x[(n+1)/2] for odd n, or (x[n/2] + x[n/2+1])/2 for even n',
                    substitution: `n = ${n} (${n % 2 === 0 ? 'even' : 'odd'})`,
                    result: med
                },
                {
                    description: this.i18n.t('mode'),
                    formula: 'Mo = value(s) with highest frequency',
                    substitution: '',
                    result: modes.length > 0 ? modes.join(', ') : '-'
                },
                {
                    description: this.i18n.t('range'),
                    formula: 'R = x_max - x_min',
                    substitution: `R = ${Math.max(...sample)} - ${Math.min(...sample)}`,
                    result: range
                }
            ];
        }

        solveEmpiricalDistribution(data) {
            const sample = data.sample;
            const n = sample.length;
            const freq = {};
            sample.forEach(x => { freq[x] = (freq[x] || 0) + 1; });
            const sortedKeys = Object.keys(freq).map(Number).sort((a, b) => a - b);
            const relFreq = this.math.relativeFrequencies(sample);
            const edf = this.math.empiricalDistributionFunction(sample);

            const steps = [{
                description: this.i18n.t('frequency'),
                formula: 'n\u1d62 = count of x\u1d62 in sample',
                substitution: sortedKeys.map(k => `n(${k}) = ${freq[k]}`).join(', '),
                result: `n = ${n}`
            }];

            steps.push({
                description: this.i18n.t('relFreq'),
                formula: 'w\u1d62 = n\u1d62 / n',
                substitution: sortedKeys.map(k => `w(${k}) = ${freq[k]}/${n}`).join(', '),
                result: sortedKeys.map(k => `w(${k}) = ${relFreq[k]}`).join(', ')
            });

            steps.push({
                description: this.i18n.t('cumFreq'),
                formula: 'F(x) = \u03A3 w\u1d62 for x\u1d62 \u2264 x',
                substitution: '',
                result: sortedKeys.map(k => `F(${k}) = ${edf[k]}`).join(', ')
            });

            return steps;
        }

        solveHistogram(data) {
            const sample = data.sample;
            const n = sample.length;
            const intervalCount = data.intervalCount;
            const min = Math.min(...sample);
            const max = Math.max(...sample);
            const width = this.math.round((max - min) / intervalCount);

            const steps = [{
                description: this.i18n.t('solveIntervalWidth'),
                formula: 'h = (x_max - x_min) / k',
                substitution: `h = (${max} - ${min}) / ${intervalCount}`,
                result: width
            }];

            for (let i = 0; i < intervalCount; i++) {
                const lower = this.math.round(min + i * width);
                // Force last interval upper bound to include max
                const upper = (i === intervalCount - 1) ? max : this.math.round(min + (i + 1) * width);
                let count = 0;
                sample.forEach(x => {
                    if (i === intervalCount - 1) {
                        if (x >= lower && x <= upper) count++;
                    } else {
                        if (x >= lower && x < upper) count++;
                    }
                });
                const relFreq = this.math.round(count / n);
                steps.push({
                    description: `[${lower}; ${upper}${i === intervalCount - 1 ? ']' : ')'}`,
                    formula: `w = n\u1d62 / n`,
                    substitution: `w = ${count} / ${n}`,
                    result: relFreq
                });
            }

            return steps;
        }

        solveConfidenceMean(data) {
            const sample = data.sample;
            const n = sample.length;
            const confidence = data.confidence;
            const result = this.math.confidenceIntervalMean(sample, confidence);

            return [
                {
                    description: this.i18n.t('mean'),
                    formula: 'x\u0304 = \u03A3x\u1d62 / n',
                    substitution: `x\u0304 = ${sample.reduce((a, b) => a + b, 0)} / ${n}`,
                    result: result.mean
                },
                {
                    description: this.i18n.t('stdDev'),
                    formula: 'S = \u221A(\u03A3(x\u1d62 - x\u0304)\u00B2 / (n-1))',
                    substitution: `n = ${n}, df = ${n - 1}`,
                    result: result.s
                },
                {
                    description: 't-quantile',
                    formula: `t(\u03B1/2, df) for confidence = ${confidence}`,
                    substitution: `t(${this.math.round((1 - confidence) / 2)}, ${n - 1})`,
                    result: result.t
                },
                {
                    description: 'Margin of error',
                    formula: '\u0394 = t * S / \u221An',
                    substitution: `\u0394 = ${result.t} * ${result.s} / \u221A${n}`,
                    result: result.margin
                },
                {
                    description: this.i18n.t('answer'),
                    formula: `(x\u0304 - \u0394; x\u0304 + \u0394)`,
                    substitution: `(${result.mean} - ${result.margin}; ${result.mean} + ${result.margin})`,
                    result: `(${result.lower}; ${result.upper})`
                }
            ];
        }

        solveConfidenceProportion(data) {
            const p = this.math.round(data.successes / data.n);
            const confidence = data.confidence;
            const result = this.math.confidenceIntervalProportion(p, data.n, confidence);

            return [
                {
                    description: this.i18n.t('proportion'),
                    formula: 'p\u0302 = m / n',
                    substitution: `p\u0302 = ${data.successes} / ${data.n}`,
                    result: result.p
                },
                {
                    description: 'Z-quantile',
                    formula: `z(\u03B1/2) for confidence = ${confidence}`,
                    substitution: '',
                    result: result.z
                },
                {
                    description: 'Margin of error',
                    formula: '\u0394 = z * \u221A(p\u0302(1-p\u0302)/n)',
                    substitution: `\u0394 = ${result.z} * \u221A(${result.p}*${this.math.round(1 - result.p)}/${data.n})`,
                    result: result.margin
                },
                {
                    description: this.i18n.t('answer'),
                    formula: '(p\u0302 - \u0394; p\u0302 + \u0394)',
                    substitution: `(${result.p} - ${result.margin}; ${result.p} + ${result.margin})`,
                    result: `(${result.lower}; ${result.upper})`
                }
            ];
        }

        solveHypothesisTesting(data) {
            const sample = data.sample;
            const n = sample.length;
            const populationMean = data.populationMean;
            const sigma = data.sigma;
            const alpha = data.alpha;
            const sampleMean = this.math.sampleMean(sample);
            const zStat = this.math.zTest(sampleMean, populationMean, sigma, n);
            const confidence = 1 - alpha;
            const zCritical = this.math.normalQuantile(confidence);
            const reject = Math.abs(zStat) > zCritical;

            return [
                {
                    description: this.i18n.t('mean'),
                    formula: 'x\u0304 = \u03A3x\u1d62 / n',
                    substitution: `n = ${n}`,
                    result: sampleMean
                },
                {
                    description: this.i18n.t('zValue'),
                    formula: 'z = (x\u0304 - \u03BC\u2080) / (\u03C3 / \u221An)',
                    substitution: `z = (${sampleMean} - ${populationMean}) / (${sigma} / \u221A${n})`,
                    result: zStat
                },
                {
                    description: this.i18n.t('criticalValue'),
                    formula: `z_crit for \u03B1 = ${alpha} (two-tailed)`,
                    substitution: `P(|Z| > z_crit) = ${alpha}`,
                    result: zCritical
                },
                {
                    description: this.i18n.t('conclusion'),
                    formula: `|z| ${Math.abs(zStat) > zCritical ? '>' : '\u2264'} z_crit`,
                    substitution: `|${zStat}| = ${this.math.round(Math.abs(zStat))} vs ${zCritical}`,
                    result: reject ? this.i18n.t('rejectH0') : this.i18n.t('acceptH0')
                }
            ];
        }

        solveZTest(data) {
            // Same as hypothesis testing since both use Z-test
            return this.solveHypothesisTesting(data);
        }

        solveTTest(data) {
            const sample = data.sample;
            const n = sample.length;
            const populationMean = data.populationMean;
            const alpha = data.alpha;
            const sampleMean = this.math.sampleMean(sample);
            const s = this.math.standardDeviation(sample);
            const df = n - 1;
            const tStat = this.math.tTest(sampleMean, populationMean, s, n);
            const confidence = 1 - alpha;
            const tCritical = this.math.tQuantile(confidence, df);
            const reject = Math.abs(tStat) > tCritical;

            return [
                {
                    description: this.i18n.t('mean'),
                    formula: 'x\u0304 = \u03A3x\u1d62 / n',
                    substitution: `n = ${n}`,
                    result: sampleMean
                },
                {
                    description: this.i18n.t('stdDev'),
                    formula: 'S = \u221A(\u03A3(x\u1d62 - x\u0304)\u00B2 / (n-1))',
                    substitution: `df = ${df}`,
                    result: s
                },
                {
                    description: this.i18n.t('tValue'),
                    formula: 't = (x\u0304 - \u03BC\u2080) / (S / \u221An)',
                    substitution: `t = (${sampleMean} - ${populationMean}) / (${s} / \u221A${n})`,
                    result: tStat
                },
                {
                    description: this.i18n.t('criticalValue'),
                    formula: `t_crit(${alpha}, ${df}) (two-tailed)`,
                    substitution: `\u03B1 = ${alpha}, df = ${df}`,
                    result: tCritical
                },
                {
                    description: this.i18n.t('conclusion'),
                    formula: `|t| ${Math.abs(tStat) > tCritical ? '>' : '\u2264'} t_crit`,
                    substitution: `|${tStat}| = ${this.math.round(Math.abs(tStat))} vs ${tCritical}`,
                    result: reject ? this.i18n.t('rejectH0') : this.i18n.t('acceptH0')
                }
            ];
        }

        solveVariance(data) {
            const sample = data.sample;
            const n = sample.length;
            const mean = this.math.sampleMean(sample);
            const variance = this.math.correctedVariance(sample);
            const sumSqDiff = this.math.round(sample.reduce((sum, x) => sum + Math.pow(x - mean, 2), 0));

            return [
                {
                    description: this.i18n.t('mean'),
                    formula: 'x\u0304 = \u03A3x\u1d62 / n',
                    substitution: `x\u0304 = ${sample.reduce((a, b) => a + b, 0)} / ${n}`,
                    result: mean
                },
                {
                    description: '\u03A3(x\u1d62 - x\u0304)\u00B2',
                    formula: 'Sum of squared deviations',
                    substitution: `\u03A3(x\u1d62 - ${mean})\u00B2`,
                    result: sumSqDiff
                },
                {
                    description: this.i18n.t('variance'),
                    formula: 'S\u00B2 = \u03A3(x\u1d62 - x\u0304)\u00B2 / (n-1)',
                    substitution: `S\u00B2 = ${sumSqDiff} / (${n} - 1) = ${sumSqDiff} / ${n - 1}`,
                    result: variance
                }
            ];
        }

        solveStdDeviation(data) {
            const steps = this.solveVariance(data);
            const stdDev = this.math.standardDeviation(data.sample);
            const variance = this.math.correctedVariance(data.sample);
            steps.push({
                description: this.i18n.t('stdDev'),
                formula: 'S = \u221A(S\u00B2)',
                substitution: `S = \u221A(${variance})`,
                result: stdDev
            });
            return steps;
        }

        solveMedian(data) {
            const sample = data.sample;
            const sorted = [...sample].sort((a, b) => a - b);
            const n = sorted.length;
            const med = this.math.median(sample);

            const steps = [{
                description: this.i18n.t('solveSortSample'),
                formula: this.i18n.t('solveArrangeAscending'),
                substitution: sorted.join(', '),
                result: `n = ${n}`
            }];

            if (n % 2 === 0) {
                const mid1 = sorted[n / 2 - 1];
                const mid2 = sorted[n / 2];
                steps.push({
                    description: this.i18n.t('median'),
                    formula: 'Me = (x[n/2] + x[n/2+1]) / 2',
                    substitution: `Me = (${mid1} + ${mid2}) / 2`,
                    result: med
                });
            } else {
                const midIdx = Math.floor(n / 2);
                steps.push({
                    description: this.i18n.t('median'),
                    formula: 'Me = x[(n+1)/2]',
                    substitution: `Me = x[${midIdx + 1}] = ${sorted[midIdx]}`,
                    result: med
                });
            }
            return steps;
        }

        solveMode(data) {
            const sample = data.sample;
            const freq = {};
            sample.forEach(x => { freq[x] = (freq[x] || 0) + 1; });
            const maxFreq = Math.max(...Object.values(freq));
            const modes = this.math.mode(sample);

            return [
                {
                    description: this.i18n.t('frequency'),
                    formula: 'Count occurrences of each value',
                    substitution: Object.keys(freq).map(Number).sort((a, b) => a - b)
                        .map(k => `${k}: ${freq[k]}`).join(', '),
                    result: `Max frequency = ${maxFreq}`
                },
                {
                    description: this.i18n.t('mode'),
                    formula: 'Mo = value(s) with maximum frequency',
                    substitution: '',
                    result: modes.length > 0 ? modes.join(', ') : '-'
                }
            ];
        }

        solveIntervalSeries(data) {
            const sample = data.sample;
            const n = sample.length;
            const intervalCount = data.intervalCount;
            const min = Math.min(...sample);
            const max = Math.max(...sample);
            const width = this.math.round((max - min) / intervalCount);

            const steps = [{
                description: this.i18n.t('solveIntervalWidth'),
                formula: 'h = (x_max - x_min) / k',
                substitution: `h = (${max} - ${min}) / ${intervalCount}`,
                result: width
            }];

            for (let i = 0; i < intervalCount; i++) {
                const lower = this.math.round(min + i * width);
                // Force last interval upper bound to include max
                const upper = (i === intervalCount - 1) ? max : this.math.round(min + (i + 1) * width);
                let count = 0;
                sample.forEach(x => {
                    if (i === intervalCount - 1) {
                        if (x >= lower && x <= upper) count++;
                    } else {
                        if (x >= lower && x < upper) count++;
                    }
                });
                steps.push({
                    description: `[${lower}; ${upper}${i === intervalCount - 1 ? ']' : ')'}`,
                    formula: this.i18n.t('solveCountValues'),
                    substitution: `${this.i18n.t('solveValuesIn')} [${lower}; ${upper}${i === intervalCount - 1 ? ']' : ')'}`,
                    result: `n\u1d62 = ${count}`
                });
            }
            return steps;
        }
    }

    /* ============================================================
       App Class - Main Application Controller
       ============================================================
       Orchestrates all other classes. Manages:
       - State (current task, score, timer, language, dark mode)
       - Navigation between task types
       - localStorage persistence
       - Event handling
       - UI updates
    */
    class App {
        constructor() {
            this.i18n = new I18n();
            this.math = new MathEngine();
            this.dataGen = new DataGenerator();
            this.renderer = new TaskRenderer(this.i18n, this.math);
            this.checker = new AnswerChecker(this.math);
            this.solutionDisplay = new SolutionDisplay(this.i18n, this.math);

            // Task types configuration
            this.taskTypes = [
                'sampleCharacteristics',
                'empiricalDistribution',
                'histogram',
                'confidenceMean',
                'confidenceProportion',
                'hypothesisTesting',
                'zTest',
                'tTest',
                'variance',
                'stdDeviation',
                'medianCalc',
                'modeCalc',
                'intervalSeries'
            ];

            // Task icons for sidebar
            this.taskIcons = {
                sampleCharacteristics: '\u03BC',
                empiricalDistribution: 'F(x)',
                histogram: '\u2593',
                confidenceMean: '\u00B1',
                confidenceProportion: 'p\u0302',
                hypothesisTesting: 'H\u2080',
                zTest: 'Z',
                tTest: 't',
                variance: 'S\u00B2',
                stdDeviation: 'S',
                medianCalc: 'Me',
                modeCalc: 'Mo',
                intervalSeries: '[ ]'
            };

            // Application state
            this.state = {
                currentTask: 'sampleCharacteristics',
                currentData: null,
                score: { correct: 0, total: 0 },
                completedTasks: [],
                timerSeconds: 0,
                timerInterval: null,
                darkMode: false,
                language: 'ru',
                alreadyChecked: false
            };
        }

        /**
         * Initialize the application
         * Sets up event listeners, loads saved state, renders initial view
         */
        init() {
            this.loadProgress();
            this.renderSidebar();
            this.selectTask(this.state.currentTask);
            this.startTimer();
            this.updateScore();
            this.updateProgress();
            this.applyTheme();
            this.updateLanguageButtons();
        }

        /**
         * Render the sidebar navigation with all task types
         */
        renderSidebar() {
            const nav = document.getElementById('taskNav');
            const i18n = this.i18n;
            nav.innerHTML = '';
            this.taskTypes.forEach(taskType => {
                const li = document.createElement('li');
                li.className = 'sidebar__nav-item' +
                    (taskType === this.state.currentTask ? ' sidebar__nav-item--active' : '');
                li.innerHTML = `<span class="sidebar__nav-item-icon">${this.taskIcons[taskType]}</span>
                    <span>${i18n.t('tasks.' + taskType)}</span>`;
                li.onclick = () => this.selectTask(taskType);
                nav.appendChild(li);
            });
        }

        /**
         * Select and render a specific task type
         */
        selectTask(taskType) {
            this.state.currentTask = taskType;
            this.generateNewData();
            this.renderSidebar(); // Update active state
            this.saveProgress();
        }

        /**
         * Generate new random data for the current task and re-render
         */
        generateNewData() {
            this.state.alreadyChecked = false;
            const taskType = this.state.currentTask;
            let data;

            switch (taskType) {
                case 'sampleCharacteristics': data = this.dataGen.generateSampleCharacteristicsData(); break;
                case 'empiricalDistribution': data = this.dataGen.generateEmpiricalDistributionData(); break;
                case 'histogram': data = this.dataGen.generateHistogramData(); break;
                case 'confidenceMean': data = this.dataGen.generateConfidenceIntervalMeanData(); break;
                case 'confidenceProportion': data = this.dataGen.generateConfidenceIntervalProportionData(); break;
                case 'hypothesisTesting': data = this.dataGen.generateHypothesisTestData(); break;
                case 'zTest': data = this.dataGen.generateZTestData(); break;
                case 'tTest': data = this.dataGen.generateTTestData(); break;
                case 'variance': data = this.dataGen.generateVarianceData(); break;
                case 'stdDeviation': data = this.dataGen.generateStdDevData(); break;
                case 'medianCalc': data = this.dataGen.generateMedianData(); break;
                case 'modeCalc': data = this.dataGen.generateModeData(); break;
                case 'intervalSeries': data = this.dataGen.generateIntervalSeriesData(); break;
                default: data = this.dataGen.generateSampleCharacteristicsData();
            }

            this.state.currentData = data;
            this.renderCurrentTask();
        }

        /**
         * Render the current task in the content area
         */
        renderCurrentTask() {
            const content = document.getElementById('taskContent');
            content.innerHTML = this.renderer.renderTask(this.state.currentTask, this.state.currentData);
        }

        /**
         * Check all user answers for the current task
         * Guarded against repeated submission - only scores once per data set
         */
        checkAnswers() {
            // Prevent score inflation by blocking re-check on same data
            if (this.state.alreadyChecked) {
                // Still show highlighting but do not add to score again
                const results = this.checker.checkAllAnswers();
                this.checker.highlightResults(results);
                return;
            }

            const results = this.checker.checkAllAnswers();
            this.checker.highlightResults(results);

            const scoreResult = this.checker.calculateScore(results);
            if (scoreResult.total > 0) {
                this.state.score.correct += scoreResult.correct;
                this.state.score.total += scoreResult.total;
                this.updateScore();

                // Mark task as completed if all correct
                if (scoreResult.percentage === 100 && !this.state.completedTasks.includes(this.state.currentTask)) {
                    this.state.completedTasks.push(this.state.currentTask);
                    this.updateProgress();
                }
            }
            this.state.alreadyChecked = true;
            this.saveProgress();
        }

        /**
         * Show the step-by-step solution for the current task
         */
        showSolution() {
            const solutionArea = document.getElementById('solution-area');
            if (solutionArea) {
                const steps = this.solutionDisplay.generateSolution(this.state.currentTask, this.state.currentData);
                solutionArea.innerHTML = this.solutionDisplay.renderSolution(steps);
            }
        }

        /**
         * Fill in all correct answers (Show Answers button)
         */
        showAnswers() {
            const inputs = document.querySelectorAll('.input-field__input');
            inputs.forEach(input => {
                const answer = input.getAttribute('data-answer');
                input.value = answer;
                input.classList.remove('input-field__input--incorrect');
                input.classList.add('input-field__input--correct');
            });
        }

        /**
         * Toggle dark/light mode
         */
        toggleDarkMode() {
            this.state.darkMode = !this.state.darkMode;
            this.applyTheme();
            this.saveProgress();
        }

        /**
         * Apply the current theme (dark or light)
         */
        applyTheme() {
            if (this.state.darkMode) {
                document.documentElement.setAttribute('data-theme', 'dark');
                document.getElementById('darkToggle').textContent = this.i18n.t('lightMode');
            } else {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('darkToggle').textContent = this.i18n.t('darkMode');
            }
        }

        /**
         * Switch the UI language
         */
        toggleLanguage(lang) {
            this.state.language = lang;
            this.i18n.setLanguage(lang);
            this.updateLanguageButtons();
            this.renderSidebar();
            this.renderCurrentTask();
            this.updateUITexts();
            this.saveProgress();
        }

        /**
         * Update language button active states
         */
        updateLanguageButtons() {
            document.querySelectorAll('.header__lang-btn').forEach(btn => {
                btn.classList.toggle('header__lang-btn--active', btn.getAttribute('data-lang') === this.state.language);
            });
        }

        /**
         * Update all static UI text elements to current language
         */
        updateUITexts() {
            document.getElementById('headerTitle').textContent = this.i18n.t('headerTitle');
            document.getElementById('sidebarTitle').textContent = this.i18n.t('sidebarTitle');
            document.getElementById('footerText').textContent = this.i18n.t('footerText');
        }

        /**
         * Start the elapsed time timer
         */
        startTimer() {
            if (this.state.timerInterval) clearInterval(this.state.timerInterval);
            this.state.timerInterval = setInterval(() => {
                this.state.timerSeconds++;
                this.updateTimerDisplay();
            }, 1000);
            this.updateTimerDisplay();
        }

        /**
         * Update the timer display in MM:SS format
         */
        updateTimerDisplay() {
            const minutes = Math.floor(this.state.timerSeconds / 60);
            const seconds = this.state.timerSeconds % 60;
            const display = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            document.getElementById('timer').textContent = display;
        }

        /**
         * Update the score display
         */
        updateScore() {
            document.getElementById('score').textContent = `${this.state.score.correct}/${this.state.score.total}`;
        }

        /**
         * Update the progress indicator (bar and text)
         */
        updateProgress() {
            const total = this.taskTypes.length;
            const completed = this.state.completedTasks.length;
            const percentage = Math.round((completed / total) * 100);
            document.getElementById('progressFill').style.width = percentage + '%';
            document.getElementById('progressText').textContent = `${completed}/${total}`;
        }

        /**
         * Save current progress to localStorage
         */
        saveProgress() {
            const saveData = {
                currentTask: this.state.currentTask,
                score: this.state.score,
                completedTasks: this.state.completedTasks,
                timerSeconds: this.state.timerSeconds,
                darkMode: this.state.darkMode,
                language: this.state.language
            };
            try {
                localStorage.setItem('statistics_platform_state', JSON.stringify(saveData));
            } catch (e) {
                // localStorage might be unavailable in some contexts
            }
        }

        /**
         * Load saved progress from localStorage
         */
        loadProgress() {
            try {
                const saved = localStorage.getItem('statistics_platform_state');
                if (saved) {
                    const data = JSON.parse(saved);
                    this.state.currentTask = data.currentTask || 'sampleCharacteristics';
                    this.state.score = data.score || { correct: 0, total: 0 };
                    this.state.completedTasks = data.completedTasks || [];
                    this.state.timerSeconds = data.timerSeconds || 0;
                    this.state.darkMode = data.darkMode || false;
                    this.state.language = data.language || 'ru';
                    this.i18n.setLanguage(this.state.language);
                }
            } catch (e) {
                // If parsing fails, use default state
            }
        }

        /**
         * Reset all progress - clears localStorage and resets state
         */
        resetProgress() {
            try {
                localStorage.removeItem('statistics_platform_state');
            } catch (e) {}
            this.state.score = { correct: 0, total: 0 };
            this.state.completedTasks = [];
            this.state.timerSeconds = 0;
            if (this.state.timerInterval) clearInterval(this.state.timerInterval);
            this.state.currentTask = 'sampleCharacteristics';
            this.updateScore();
            this.updateProgress();
            this.startTimer();
            this.selectTask('sampleCharacteristics');
        }
    }

    /* ============================================================
       Application Initialization
       ============================================================
       Create the App instance and initialize when the DOM is ready.
    */
    let app;
    document.addEventListener('DOMContentLoaded', function() {
        app = new App();
        app.init();
    });
    </script>
</body>
</html>
