<style>

<script>
// =========================================================
//  STATE & HELPERS

const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;

let P = {}; // randomized parameters
const checkedQ = {}; // tracks which questions are checked

//  PARAMETER GENERATION

    q1:(()=>{ const n1=rand(2,9); let n2; do { n2=rand(2,9); } while(n2===n1); return {n1,n2}; })(),

    q21:(()=>{ const a=pick([1,2,3]); let b; do { b=pick([2,3,4,5]); } while(b===a); return {a,b}; })(),
    q25:{mu:rand(1,6), sigma:pick([2,3,4,5]), n:pick([4,5,6,7,8])},
    q29:(()=>{ const m=pick([3,4,5,6,7]); let n; do { n=pick([3,4,5,6,7]); } while(n===m); return {m,n}; })(),

}

// =========================================================
//  STATIC TEXT (questions that don't change)
// =========================================================
const Q_TEXT = {

    en:"If $X \\sim N(\\mu, \\sigma^2)$, what distribution does $Z = (X - \\mu)/\\sigma$ have?"

// =========================================================
//  TRILINGUAL TEXT BLOCK
// =========================================================
function trilang(t){
  return `<div class="q-text"><span class="lang-tag">UZB:</span> ${t.uz}</div>
<div class="q-text"><span class="lang-tag">RU:</span> ${t.ru}</div>
<div class="q-text"><span class="lang-tag">ENG:</span> ${t.en}</div>`;
}

// =========================================================
//  QUESTION BUILDERS
//  Each builder returns: { html, answer, solutionHTML }
//  for randomizable questions; for static ones we still
//  build dynamically so layout is identical.
// =========================================================

// Build a single-choice card
function singleCard(num, points, textHtml, opts, correctKey, solutionHtml){
  let optsHtml = opts.map(o =>
    `<label class="option"><input type="radio" name="q${num}" value="${o.k}"><span>${o.k}. &nbsp; ${o.t}</span></label>`
  ).join('');
  return {
    html: `<div class="question-card" id="card-q${num}">
      <div class="q-head"><div class="q-num">Savol ${num} / Вопрос ${num} / Question ${num}</div><div class="q-pts">${points} ball</div></div>
      ${textHtml}
      <div class="options-box">${optsHtml}</div>
      <div id="fb-q${num}" class="feedback"></div>
      <button class="solution-toggle" id="sol-btn-q${num}" style="display:none" onclick="toggleSol(${num})">Yechim / Решение / Solution</button>
      <div class="solution" id="sol-q${num}">${solutionHtml}</div>
    </div>`,
    answer: correctKey
  };
}

function step(label, formula){
  return `<div class="step"><b>${label}:</b> ${formula}</div>`;
}
function ans(formula){
  return `<div class="ans">${formula}</div>`;
}

// =========================================================
//  Q1: chi^2(n1) + chi^2(n2)
// =========================================================
function buildQ1(){
  const {n1,n2} = P.q1;
  const text = trilang({
    uz:`$\\chi^2(${n1})$ va $\\chi^2(${n2})$ mustaqil bo'lsa, ularning yig'indisi qanday taqsimotga ega?`,
    ru:`Если $\\chi^2(${n1})$ и $\\chi^2(${n2})$ независимы, какое распределение имеет их сумма?`,
    en:`If $\\chi^2(${n1})$ and $\\chi^2(${n2})$ are independent, what distribution does their sum have?`
  });
  const opts = [
    {k:'a', t:`$t(${n1+n2})$`},
    {k:'b', t:`$\\chi^2(${n1+n2})$`},
    {k:'c', t:`$F(${n1}, ${n2})$`},
    {k:'d', t:`$\\chi^2(${n1*n2})$`}
  ];
  const sol = `<h4>Yechim / Решение / Solution</h4>
    <p>UZB: Ikki mustaqil $\\chi^2$ taqsimotning yig'indisi erkin daraja yig'indisi bilan $\\chi^2$ taqsimot beradi.</p>
    <p>RU: Сумма двух независимых $\\chi^2$ величин снова имеет $\\chi^2$ распределение со степенью, равной сумме.</p>
    <p>EN: The sum of independent chi-squared variables is chi-squared with summed degrees of freedom.</p>
    ${step('Formula', `$\\chi^2(n_1)+\\chi^2(n_2) \\sim \\chi^2(n_1+n_2)$`)}
    ${step('Substitution', `$\\chi^2(${n1})+\\chi^2(${n2}) \\sim \\chi^2(${n1}+${n2})$`)}
    ${ans(`$\\boxed{\\chi^2(${n1+n2})}$ &nbsp; (option b)`)}`;
  return singleCard(1,3,text,opts,'b',sol);
}

// =========================================================
//  Q2: T~t(n), F=T^2 ~ F(1,n)
// =========================================================
function buildQ2(){
  const {n} = P.q2;
  const text = trilang({
    uz:`$T \\sim t(${n})$. $F = T^2$ qanday taqsimotga ega?`,
    ru:`Пусть $T \\sim t(${n})$. Какое распределение имеет $F = T^2$?`,
    en:`Let $T \\sim t(${n})$. What distribution does $F = T^2$ have?`
  });
  const opts = [
    {k:'a', t:`$F(2, ${n})$`},
    {k:'b', t:`$F(1, ${n})$`},
    {k:'c', t:`$F(${n}, 1)$`},
    {k:'d', t:`$\\chi^2(${n})$`}
  ];
  const sol = `<h4>Yechim / Решение / Solution</h4>
    <p>By definition $T = \\dfrac{Z}{\\sqrt{Y/n}}$, where $Z \\sim N(0,1)$, $Y \\sim \\chi^2(n)$, independent.</p>
    ${step('Square it', `$T^2 = \\dfrac{Z^2}{Y/n} = \\dfrac{Z^2/1}{Y/n}$`)}
    ${step('Note', `$Z^2 \\sim \\chi^2(1)$, $Y \\sim \\chi^2(${n})$`)}
    ${step('F definition', `$\\dfrac{\\chi^2(1)/1}{\\chi^2(${n})/${n}} \\sim F(1, ${n})$`)}
    ${ans(`$\\boxed{F(1, ${n})}$ &nbsp; (option b)`)}`;
  return singleCard(2,3,text,opts,'b',sol);
}

// =========================================================
//  Q3 (static)
// =========================================================
function buildQ3(){
  const text = trilang(Q_TEXT.q3);
  const opts = [
    {k:'a', t:`[RU] Для нахождения дисперсии. [EN] To find variance. "Dispersiyani topish uchun."`},
    {k:'b', t:`[RU] Для генерации случайных чисел. [EN] To generate random numbers. "Tasodifiy sonlar yaratish uchun."`},
    {k:'c', t:`[RU] Для подсчёта количества событий. [EN] To count number of events. "Hodisalar sonini hisoblash uchun."`},
    {k:'d', t:`[RU] Для нахождения вероятности на отрезке. [EN] To find probability on an interval. "Segmentdagi ehtimollikni topish uchun."`}
  ];
  const sol = `<h4>Yechim / Решение / Solution</h4>
    <p>Zichlik funksiyasi $f(x)$ orqali oraliqdagi ehtimollik integral bilan topiladi:</p>
    ${step('Formula', `$P(a \\le X \\le b) = \\int_a^b f(x)\\,dx$`)}
    <p>Bu zichlik funksiyasining asosiy ma'nosidir.</p>
    ${ans(`(d) Segmentdagi ehtimollikni topish uchun`)}`;
  return singleCard(3,3,text,opts,'d',sol);
}


// =========================================================
//  Q4 (static)
// =========================================================
function buildQ4(){
  const text = trilang(Q_TEXT.q4);
  const opts = [
    {k:'a', t:`[RU] При выборке без возвращения из конечной совокупности. [EN] Sampling without replacement from a finite population. "Cheklangan to'plamdan qaytarsiz tanlashda."`},
    {k:'b', t:`[RU] Только для временных рядов. [EN] Only for time series.`},
    {k:'c', t:`[RU] Для непрерывных величин. [EN] For continuous variables.`},
    {k:'d', t:`[RU] В задачах с бесконечным числом испытаний. [EN] With infinite trials.`}
  ];
  const sol = `<h4>Yechim / Решение / Solution</h4>
    <p>Gipergeometrik taqsimot $N$ ta elementdan iborat to'plamdan $n$ ta elementni <b>qaytarsiz</b> tanlashda muvaffaqiyatlar sonini modellashtiradi.</p>
    ${step('PMF', `$P(X=k) = \\dfrac{C_K^k \\, C_{N-K}^{n-k}}{C_N^n}$`)}
    ${ans(`(a) Cheklangan to'plamdan qaytarsiz tanlashda`)}`;
  return singleCard(4,3,text,opts,'a',sol);
}

// =========================================================
//  Q5: Match densities (static, 5 items, 0.6 pts each)
// =========================================================
function buildQ5(){
  const text = trilang({
    uz:`Quyida uzluksiz taqsimotlar zichlik funksiyalari keltirilgan. Moslikni o'rnating:`,
    ru:`Ниже приведены формулы плотностей непрерывных распределений. Установите соответствие:`,
    en:`Below are the density functions of continuous distributions. Match each function:`
  });
  const items = [
    {id:'q5_1', f:`$f(x) = 2e^{-2x}, \\; x \\ge 0$`, ans:'exponential'},
    {id:'q5_2', f:`$f(x) = \\dfrac{1}{5}, \\; x \\in [-3, 2]$`, ans:'uniform'},
    {id:'q5_3', f:`$f(x) = \\dfrac{1}{\\pi\\sqrt{x(1-x)}}, \\; 0 < x < 1$`, ans:'arcsine'},
    {id:'q5_4', f:`$f(x) = \\dfrac{1}{0.5\\sqrt{2\\pi}} e^{-\\frac{(x-3)^2}{2 \\cdot 0.5^2}}$`, ans:'normal'},
    {id:'q5_5', f:`$f(x) = \\dfrac{1}{\\sqrt{2\\pi}} e^{-\\frac{x^2}{2}}$`, ans:'std_normal'}
  ];
  const optList = [
    ['exponential','Показательное / Exponential'],
    ['arcsine','Арксинус / Arcsine'],
    ['std_normal','Стандартное нормальное / Standard normal'],
    ['uniform','Равномерное / Uniform'],
    ['normal','Нормальное / Normal']

// =========================================================
//  Q11: D[chi^2(n)] = 2n
// =========================================================
function buildQ11(){
  const {n} = P.q11;
  const correct = 2*n;
  // Build distractors making sure they differ
  const distractors = new Set([n, n+2, 2*n+2, 2*n-2, n*n, Math.max(1, n-1)]);
  distractors.delete(correct);
  const wrongs = [...distractors].slice(0,3);
  // Mix and find correct position
  const choices = [...wrongs, correct];
  // shuffle deterministically
  for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
  const correctIdx = choices.indexOf(correct);
  const keys = ['a','b','c','d'];
  const correctKey = keys[correctIdx];
  const opts = choices.map((c,i)=>({k:keys[i], t:`$${c}$`}));
  const text = trilang({
    uz:`Agar $T \\sim \\chi^2(${n})$ bo'lsa, $D[T]$ nimaga teng?`,
    ru:`Если $T \\sim \\chi^2(${n})$, чему равно $D[T]$?`,
    en:`If $T \\sim \\chi^2(${n})$, what is $D[T]$?`
  });
  const sol = `<h4>Yechim / Решение / Solution</h4>
    <p>$\\chi^2(n)$ taqsimotining sonli xarakteristikalari:</p>
    ${step('Mat. kutilma', `$\\mathbb{E}[\\chi^2(n)] = n$`)}
    ${step('Dispersiya', `$D[\\chi^2(n)] = 2n$`)}
    ${step('Substitution', `$D[\\chi^2(${n})] = 2 \\cdot ${n} = ${correct}$`)}
    ${ans(`$\\boxed{${correct}}$ &nbsp; (option ${correctKey})`)}`;
  return singleCard(11,3,text,opts,correctKey,sol);
}

// =========================================================
//  Q21: marginal of joint exponential (randomized)
// =========================================================
function buildQ21(){
  const {a,b} = P.q21;
  const A = a*b; // joint coefficient
  const text = trilang({
    uz:`$f(x, y) = ${A}e^{-${a===1?'':a}x-${b===1?'':b}y}$ ($x > 0, y > 0$) uchun marginal zichlik $f_X(x)$ ni toping.`,
    ru:`Для $f(x, y) = ${A}e^{-${a===1?'':a}x-${b===1?'':b}y}$ ($x > 0, y > 0$) найдите $f_X(x)$.`,
    en:`For $f(x, y) = ${A}e^{-${a===1?'':a}x-${b===1?'':b}y}$ ($x > 0, y > 0$), find $f_X(x)$.`
  });
  // Correct answer: a * e^(-ax)
  const correctTxt = `$${a===1?'':a}e^{-${a===1?'':a}x}$`;
  const wrong1 = `$${A}e^{-${a===1?'':a}x}$`;
  const wrong2 = `$${b===1?'':b}e^{-${b===1?'':b}x}$`;
  const wrong3 = `$e^{-${a===1?'':a}x-${b===1?'':b}y}$`;
  const choices = [correctTxt, wrong1, wrong2, wrong3];
  // shuffle
  for(let i=choices.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[choices[i],choices[j]]=[choices[j],choices[i]];}
  const correctIdx = choices.indexOf(correctTxt);
  const keys = ['a','b','c','d'];
  const opts = choices.map((c,i)=>({k:keys[i], t:c}));
  const sol = `<h4>Yechim / Решение / Solution</h4>
    <p>Marginal zichlik $f_X(x)$ ni topish uchun $y$ bo'yicha integrallaymiz:</p>
    ${step('Formula', `$f_X(x) = \\int_0^{\\infty} f(x,y)\\,dy = \\int_0^{\\infty} ${A}e^{-${a===1?'':a}x-${b===1?'':b}y}\\,dy$`)}
    ${step('Factor out', `$= ${A}e^{-${a===1?'':a}x} \\int_0^{\\infty} e^{-${b===1?'':b}y}\\,dy$`)}
    ${step('Integral', `$\\int_0^{\\infty} e^{-${b===1?'':b}y}\\,dy = \\dfrac{1}{${b}}$`)}
    ${step('Result', `$f_X(x) = ${A}e^{-${a===1?'':a}x} \\cdot \\dfrac{1}{${b}} = ${a===1?'':a}e^{-${a===1?'':a}x}$`)}
    ${ans(correctTxt + ` &nbsp; (option ${keys[correctIdx]})`)}`;
  return singleCard(21,3,text,opts,keys[correctIdx],sol);
}

    uz:`$U \\sim \\chi^2(${m})$ va $V \\sim \\chi^2(${n})$ mustaqil. $F = \\dfrac{U/${m}}{V/${n}}$ qanday taqsimotga ega?`,
    ru:`$U \\sim \\chi^2(${m})$ и $V \\sim \\chi^2(${n})$ независимы. Какое распределение имеет $F = \\dfrac{U/${m}}{V/${n}}$?`,
    en:`$U \\sim \\chi^2(${m})$ and $V \\sim \\chi^2(${n})$ are independent. What distribution does $F = \\dfrac{U/${m}}{V/${n}}$ have?`
  });
  const opts = [
    {k:'a', t:`$F(${n}, ${m})$`},
    {k:'b', t:`$\\chi^2(${m+n})$`},
    {k:'c', t:`$F(${m}, ${n})$`},
    {k:'d', t:`$t(${m+n})$`}
  ];
  const sol = `<h4>Yechim / Решение / Solution</h4>
    <p>$F$-taqsimotning ta'rifi (tartibga e'tibor: birinchi numerator):</p>
    ${step('Definition', `$\\dfrac{U/m}{V/n} \\sim F(m, n)$`)}
    ${step('Substitute', `$\\dfrac{U/${m}}{V/${n}} \\sim F(${m}, ${n})$`)}
    <p>Eslatma: $F(${m},${n}) \\ne F(${n},${m})$ — tartib muhim!</p>
    ${ans(`(c) $F(${m}, ${n})$`)}`;
  return singleCard(33,3,text,opts,'c',sol);
}


// =========================================================
//  Q34: t(k) — randomized
// =========================================================
function buildQ34(){
  const {k} = P.q34;
  const total = k+1; // need k+1 random vars: Z_1 in numerator, Z_2..Z_{k+1} in denominator
  const denomList = Array.from({length:k}, (_,i)=>`Z_${i+2}^2`).join(' + ');
  const text = trilang({
    uz:`$Z_1, \\ldots, Z_${total} \\sim N(0, 1)$ mustaqil. Quyidagilardan qaysi biri $t(${k})$ taqsimotiga ega?`,
    ru:`$Z_1, \\ldots, Z_${total} \\sim N(0, 1)$ независимы. Какое выражение имеет распределение $t(${k})$?`,
    en:`$Z_1, \\ldots, Z_${total} \\sim N(0, 1)$ independent. Which has $t(${k})$ distribution?`
  });
  // For option B: wrong because numerator has 2 vars (not single Z) and no /k division
  const denomNoSq = Array.from({length:k}, (_,i)=>`Z_${i+2}^2`).join(' + ');
  const opts = [
    {k:'a', t:`$\\dfrac{Z_1}{\\sqrt{(${denomList})/${k}}}$`},
    {k:'b', t:`$\\dfrac{Z_1 + Z_2}{\\sqrt{${denomNoSq}}}$`},
    {k:'c', t:`$\\dfrac{Z_1^2}{\\sqrt{(${denomList})/${k}}}$`},
    {k:'d', t:`$\\dfrac{Z_1}{\\sqrt{(Z_1^2 + ${Array.from({length:k-1}, (_,i)=>`Z_${i+2}^2`).join(' + ')})/${k}}}$`}
  ];
  const sol = `<h4>Yechim / Решение / Solution</h4>
    <p>$t(k)$ ta'rifiga ko'ra: $T = \\dfrac{Z}{\\sqrt{Y/k}}$, bu yerda $Z \\sim N(0,1)$, $Y \\sim \\chi^2(k)$, mustaqil.</p>
    ${step('Build Y', `$Y = ${denomList} \\sim \\chi^2(${k})$ (chunki ${k} ta mustaqil $N(0,1)$ kvadrati)`)}
    ${step('Independence', `$Z_1$ — $Y$ tarkibida ishtirok etmaydi, demak $Z_1 \\perp Y$`)}
    ${step('Result', `$\\dfrac{Z_1}{\\sqrt{Y/${k}}} = \\dfrac{Z_1}{\\sqrt{(${denomList})/${k}}} \\sim t(${k})$`)}
    <p>Boshqa variantlardagi xatolar: numerator kvadratga olingan, mustaqillik buzilgan, yoki erkin daraja noto'g'ri.</p>
    ${ans(`(a)`)}`;
  return singleCard(34,3,text,opts,'a',sol);
}

// =========================================================
//  Q35: chi^2(n) (randomized)
// =========================================================
function buildQ35(){
  const {mu, sigma, n} = P.q35;
  const sigma2 = sigma*sigma;
  const text = trilang({
    uz:`$X_1, \\ldots, X_${n} \\sim N(${mu}, ${sigma2})$ mustaqil. $W = \\sum_{i=1}^{${n}} \\left(\\dfrac{X_i-${mu}}{${sigma}}\\right)^2$ qanday taqsimotga ega?`,
    ru:`$X_1, \\ldots, X_${n} \\sim N(${mu}, ${sigma2})$ независимы. Какое распределение имеет $W = \\sum_{i=1}^{${n}} \\left(\\dfrac{X_i-${mu}}{${sigma}}\\right)^2$?`,
    en:`$X_1, \\ldots, X_${n} \\sim N(${mu}, ${sigma2})$ independent. What distribution does $W = \\sum_{i=1}^{${n}} \\left(\\dfrac{X_i-${mu}}{${sigma}}\\right)^2$ have?`
  });
  const opts = [
    {k:'a', t:`$\\chi^2(${Math.max(1,Math.floor(n/2))})$`},
    {k:'b', t:`$N(${n}, ${2*n})$`},
    {k:'c', t:`$\\chi^2(${n})$`},
    {k:'d', t:`$t(${n})$`}
  ];
  const sol = `<h4>Yechim / Решение / Solution</h4>
    ${step('Standardize', `$Z_i = \\dfrac{X_i - ${mu}}{${sigma}} \\sim N(0, 1)$`)}
    ${step('Square', `$Z_i^2 \\sim \\chi^2(1)$`)}
    ${step('Sum', `$W = \\sum_{i=1}^{${n}} Z_i^2 \\sim \\chi^2(${n})$`)}
    ${ans(`(c) $\\chi^2(${n})$`)}`;
  return singleCard(35,3,text,opts,'c',sol);
}

// =========================================================
//  RENDER ALL
// =========================================================
const builders = [
  buildQ1, buildQ2, buildQ3, buildQ4, buildQ5, buildQ6, buildQ7, buildQ8, buildQ9, buildQ10,
  buildQ11, buildQ12, buildQ13, buildQ14, buildQ15, buildQ16, buildQ17, buildQ18, buildQ19, buildQ20,
  buildQ21, buildQ22, buildQ23, buildQ24, buildQ25, buildQ26, buildQ27, buildQ28, buildQ29, buildQ30,
  buildQ31, buildQ32, buildQ33, buildQ34, buildQ35
];

let questionData = {}; // store answers / data per question

function renderAll(){
  P = genParams();
  questionData = {};
  let html = '';
  builders.forEach((b, i) => {
    const num = i+1;
    const data = b();
    questionData[num] = data;
    html += data.html;
  });
  document.getElementById('questions').innerHTML = html;
  document.getElementById('result-summary').classList.remove('show');
  // Re-typeset MathJax
  if(window.MathJax && MathJax.typesetPromise){
    MathJax.typesetPromise();
  }
}

function regenerateAll(){
  renderAll();
}

// =========================================================
//  CHECK
// =========================================================
function gradeSingle(num){
  const data = questionData[num];
  const sel = document.querySelector(`input[name="q${num}"]:checked`);
  const card = document.getElementById(`card-q${num}`);
  const fb = document.getElementById(`fb-q${num}`);
  const solBtn = document.getElementById(`sol-btn-q${num}`);
  const correct = data.answer;
  card.classList.remove('correct-card','wrong-card','partial-card');
  fb.classList.remove('correct','wrong','partial');
  fb.classList.add('show');
  solBtn.style.display = 'inline-block';
  if(!sel){
    card.classList.add('wrong-card');
    fb.classList.add('wrong');
    fb.innerHTML = `Javob berilmagan / Нет ответа / Not answered &mdash; <b>0 ball</b>. To'g'ri javob: <b>(${correct})</b>`;
    return 0;
  }
  if(sel.value === correct){
    card.classList.add('correct-card');
    fb.classList.add('correct');
    fb.innerHTML = `To'g'ri / Правильно / Correct &mdash; <b>+3 ball</b>`;
    return 3;
  } else {
    card.classList.add('wrong-card');
    fb.classList.add('wrong');
    fb.innerHTML = `Noto'g'ri / Неправильно / Incorrect &mdash; <b>0 ball</b>. To'g'ri javob: <b>(${correct})</b>`;
    return 0;
  }
}

function gradeMatch(num){
  const data = questionData[num];
  const card = document.getElementById(`card-q${num}`);
  const fb = document.getElementById(`fb-q${num}`);
  const solBtn = document.getElementById(`sol-btn-q${num}`);
  const ans = data.matchAnswers;
  let correct = 0, selected = 0, total = 0;
  for(const id in ans){
    total++;
    const v = document.getElementById(id) ? document.getElementById(id).value : '';
    if(v){ selected++; if(v === ans[id]) correct++; }
  }
  const score = Math.round(correct * data.matchPerItem * 1000) / 1000;
  card.classList.remove('correct-card','wrong-card','partial-card');
  fb.classList.remove('correct','wrong','partial');
  fb.classList.add('show');
  solBtn.style.display = 'inline-block';
  if(selected === 0){
    card.classList.add('wrong-card');
    fb.classList.add('wrong');
    fb.innerHTML = `Javob berilmagan / Нет ответа &mdash; <b>0 ball</b>`;
  } else if(correct === total){
    card.classList.add('correct-card');
    fb.classList.add('correct');
    fb.innerHTML = `Barchasi to'g'ri / Все верно &mdash; <b>+${data.matchTotal} ball</b>`;
  } else if(correct > 0){
    card.classList.add('partial-card');
    fb.classList.add('partial');
    fb.innerHTML = `Qisman to'g'ri / Частично верно (${correct}/${total}) &mdash; <b>+${score} ball</b>`;
  } else {
    card.classList.add('wrong-card');
    fb.classList.add('wrong');
    fb.innerHTML = `Hammasi noto'g'ri / Все неверно &mdash; <b>0 ball</b>`;
  }
  return score;
}

function checkAll(){
  let total = 0;
  for(let n = 1; n <= 35; n++){
    const d = questionData[n];
    if(d.isMatch) total += gradeMatch(n);
    else total += gradeSingle(n);
  }
  total = Math.round(total * 1000) / 1000;
  const r = document.getElementById('result-summary');
  r.classList.add('show');
  r.innerHTML = `Umumiy ball / Общий балл / Total: <b>${total}</b> / 105`;
  if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise(); }
  r.scrollIntoView({behavior:'smooth', block:'center'});
}

function toggleSol(num){
  const sol = document.getElementById(`sol-q${num}`);
  const btn = document.getElementById(`sol-btn-q${num}`);
  if(sol.classList.contains('show')){
    sol.classList.remove('show');
    btn.textContent = 'Yechim / Решение / Solution';
  } else {
    sol.classList.add('show');
    btn.textContent = 'Yashirish / Скрыть / Hide';
    if(window.MathJax && MathJax.typesetPromise){ MathJax.typesetPromise([sol]); }
  }
}

// Initial render
renderAll();
